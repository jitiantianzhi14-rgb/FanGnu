    body { font-family: 'Roboto', 'Noto Sans JP', sans-serif; background: var(--md-surface); color: var(--md-on-surface); line-height: 1.6; padding-bottom: 64px; }

    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: 400; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; vertical-align: middle; }

    .nav { position: sticky; top: 0; z-index: 100; background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 64px; }
    .nav-logo { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 21px; color: var(--md-on-surface); }
    .nav-logo .red { color: var(--md-primary); }
    .nav-links { display: flex; gap: 1.75rem; font-size: 13px; font-weight: 500; color: var(--md-on-surface-variant); }
    .nav-links a { transition: color 0.15s; padding: 6px 0; }
    .nav-links a:hover, .nav-links a.active { color: var(--md-primary); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--md-surface-container-low); box-shadow: 0 -1px 3px rgba(0,0,0,.08); z-index: 200; }

    .bn-item:hover { color: var(--md-on-surface); }
    .bn-icon { font-size: 17px; line-height: 1; width: 46px; padding: 3px 0; border-radius: 16px; text-align: center; transition: background 0.15s; }
    .bn-item.active { color: var(--md-on-surface); font-weight: 700; }
    .bn-item.active .bn-icon { background: var(--md-primary-container); }

    .back-link { display: inline-flex; align-items: center; gap: 6px; margin: 1.25rem 2rem 0; padding: 0; background: none; border: none; font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; color: var(--md-on-surface-variant); cursor: pointer; }
    .back-link:hover { color: var(--md-primary); }

    .page-header { padding: 0.75rem 2rem 2.5rem; border-bottom: 1px solid var(--md-outline-variant); background: var(--md-surface-container-low); }
    .disc-type-badge { font-family: 'Roboto Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: var(--md-on-primary); background: var(--md-primary); padding: 3px 9px; border-radius: 8px; display: inline-block; width: fit-content; margin-bottom: 1rem; }
    .page-header-title { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.3; letter-spacing: -0.01em; color: var(--md-on-surface); }

    .content { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

    .section-label { font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--md-on-surface-variant); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: inline-block; width: 16px; height: 2px; background: var(--md-primary); }

    .album-info { background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 14px; overflow: hidden; }
    .album-info-row { display: flex; gap: 16px; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--md-outline-variant); }
    .album-info-row:last-child { border-bottom: none; }
    .album-info-label { font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--md-on-surface-variant); width: 110px; flex-shrink: 0; padding-top: 2px; }
    .album-info-value { font-size: 13px; color: var(--md-on-surface); line-height: 1.7; }
    .album-info-value.empty { color: var(--md-on-surface-variant); }
    .album-info-value a { text-decoration: underline; text-underline-offset: 2px; transition: color 0.12s; }
    .album-info-value a:hover { color: var(--md-primary); }

    .track-list { list-style: none; background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 14px; overflow: hidden; }
    .track-item { border-bottom: 1px solid var(--md-outline-variant); font-size: 13px; }
    .track-item:last-child { border-bottom: none; }
    .track-row { display: flex; align-items: center; gap: 12px; padding: 0.7rem 1.25rem; }
    a.track-row { cursor: pointer; transition: background 0.15s, color 0.15s; }
    a.track-row:hover { background: var(--md-surface-container); color: var(--md-primary); }
    .track-num { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--md-on-surface-variant); width: 22px; flex-shrink: 0; }
    .track-title { flex: 1; min-width: 0; }
    .track-detail-btn { width: 24px; height: 24px; background: var(--md-primary); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--md-on-primary); }
    .no-tracks { font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--md-on-surface-variant); padding: 2rem 0; text-align: center; border: 1px dashed var(--md-outline-variant); border-radius: 14px; }

    .action-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
    .action-btn { flex: 1 1 0; min-width: 200px; text-align: center; font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.02em; border-radius: 100px; padding: 1.1rem 1.5rem; background: var(--md-primary); color: var(--md-on-primary); transition: box-shadow 0.15s; }
    .action-btn:hover { box-shadow: var(--md-shadow-1); }
    .action-btn.outline { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); }
    .action-btn.outline:hover { background: var(--md-primary-container); border-color: transparent; }

    .footer { padding: 1.75rem 2rem; border-top: 1px solid var(--md-outline-variant); display: flex; align-items: center; justify-content: space-between; background: var(--md-surface-container-low); margin-top: 2rem; }
    .footer-logo { font-family: 'Roboto', sans-serif; font-weight: 700; font-size: 15px; color: var(--md-on-surface); }
    .footer-logo .red { color: var(--md-primary); }
    .footer-copy { font-size: 11px; color: var(--md-on-surface-variant); letter-spacing: 0.02em; text-align: right; }
    .footer-copy a { text-decoration: underline; text-underline-offset: 2px; }
    .footer-copy a:hover { color: var(--md-primary); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .page-header-title { font-size: 24px; }
      .album-info-row { flex-direction: column; gap: 4px; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
    .site-notice-overlay { position: fixed; inset: 0; background: rgba(32,26,25,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .site-notice-box { background: var(--md-surface-container-high); border-radius: 28px; max-width: 380px; width: 100%; padding: 2rem 1.75rem; text-align: center; box-shadow: var(--md-shadow-2); }
    .site-notice-icon { font-size: 28px; margin-bottom: 0.75rem; }
    .site-notice-title { font-size: 16px; font-weight: 500; color: var(--md-on-surface); margin-bottom: 0.75rem; }
    .site-notice-title .red { color: var(--md-primary); }
    .site-notice-body { font-size: 13px; color: var(--md-on-surface-variant); line-height: 1.7; margin-bottom: 1.5rem; }
    .site-notice-close { font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500; color: var(--md-on-primary); background: var(--md-primary); border: none; border-radius: 100px; padding: 0.7rem 1.6rem; cursor: pointer; transition: box-shadow 0.15s; }
    .site-notice-close:hover { box-shadow: var(--md-shadow-1); }
    .teaser-embed { margin-bottom: 24px; }
    .teaser-embed iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 14px; display: block; }
  </style>

      <a href="../privacy/">プライバシーポリシー</a> ／ <a href="../contact/">お問い合わせ</a> ／ <a href="#" onclick="window.open('https://x.com/intent/tweet?text='+encodeURIComponent(document.title)+'&url='+encodeURIComponent(location.href),'_blank','noopener');return false;">𝕏でシェア</a> ／ © FunGNU Unofficial
    </div>

  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function setInfo(id, value) {
    const el = document.getElementById(id);
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function setExtra(id, value) {
    const el = document.getElementById(id);
    if (!value) {
      el.textContent = '-';
      el.classList.add('empty');
      return;
    }
    const parts = value.split(/(\[[^\]]+\]\([^)]+\))/g);
    el.innerHTML = parts.map(part => {
      const m = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (!m) return escH(part).replace(/\n/g, '<br>');
      const isExternal = /^https?:\/\//.test(m[2]);
      return isExternal
        ? `<a href="${escH(m[2])}" target="_blank" rel="noopener">${escH(m[1])}</a>`
        : `<a href="${escH(m[2])}">${escH(m[1])}</a>`;
    }).join('');
    el.classList.remove('empty');
  }

  function songHref(slug) {
    return slug ? `../song/?slug=${encodeURIComponent(slug)}` : null;
  }

  function renderTracks(tracks) {
    const area = document.getElementById('tracksArea');
    if (!tracks || !tracks.length) {
      area.innerHTML = `<div class="no-tracks">収録曲情報はまだありません。</div>`;
      return;
    }
    area.innerHTML = `
      <ol class="track-list">${tracks.map(t => {
        const href = songHref(t.slug);
        const inner = `
          <span class="track-num">${String(t.num).padStart(2, '0')}</span>
          <span class="track-title">${escH(t.displayTitle || t.title)}</span>
          ${href ? `<span class="track-detail-btn" aria-hidden="true">→</span>` : ''}`;
        return href
          ? `<li class="track-item"><a class="track-row" href="${href}">${inner}</a></li>`
          : `<li class="track-item"><span class="track-row">${inner}</span></li>`;
      }).join('')}</ol>`;
  }

  function setTeaser(id, yt) {
    const el = document.getElementById(id);
    el.innerHTML = yt
      ? `<div class="teaser-embed"><iframe src="https://www.youtube.com/embed/${escH(yt)}?rel=0&playsinline=1" loading="lazy" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe></div>`
      : '';
  }

  function renderAlbum(album, isSrvvinci) {
    document.title = `${album.title} — アルバム概要 — FunGNU`;
    document.getElementById('albumTitle').textContent = album.title;
    setTeaser('teaserArea', album.teaserYt || album.yt);
    setInfo('infoYear', album.year);
    setExtra('infoExtra', album.extra);
    renderTracks(album.tracks);
    const backHref = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
    document.getElementById('discographyLink').href = `${backHref}?album=${encodeURIComponent(album.title)}`;
  }

  function renderNotFound(isSrvvinci) {
    document.getElementById('albumTitle').textContent = 'アルバムが見つかりませんでした';
    setTeaser('teaserArea', '');
    setInfo('infoYear', '');
    setExtra('infoExtra', '');
    renderTracks([]);
    document.getElementById('discographyLink').href = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
  }

  const params = new URLSearchParams(location.search);
  const albumTitle = params.get('album') || '';
  const isSrvvinci = params.get('src') === 'srvvinci';

  const dataUrl = isSrvvinci ? '../data/srvvinci-discography.json' : '../data/kinggnu-discography.json';

  fetch(dataUrl)
    .then(res => res.json())
    .then(data => {
      let album;
      if (isSrvvinci) {
        for (const group of (data.groups || [])) {
          album = [...(group.demos || []), ...(group.albums || [])].find(a => a.title === albumTitle);
          if (album) break;
        }
      } else {
        album = (data.albums || []).find(a => a.title === albumTitle);
      }
      if (!album) { renderNotFound(isSrvvinci); return; }
      renderAlbum(album, isSrvvinci);
    })
    .catch(err => {
      console.error(err);
      renderNotFound(isSrvvinci);
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
    }
  });
  </script>

  </nav>
