    .disc-type-badge.ミニアルバム { background: #e6942e; }
    .disc-type-badge.DEMO   { background: #7c3aed; }

    .disc-type-badge.配信SG { background: #0a84c4; }

    .disc-embed { margin-top: 20px; }
    .disc-embed:first-child { margin-top: 14px; }
    .disc-embed iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

    .disc-song-list { background: var(--white); border: 1px solid var(--border); margin-top: 10px; }
    .disc-song-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; transition: background 0.12s, color 0.12s; }
    .disc-song-row:last-child { border-bottom: none; }
    a.disc-song-row { cursor: pointer; }
    a.disc-song-row:hover { background: var(--bg); color: var(--red); }
    .disc-song-title { font-size: 14px; font-weight: 700; color: inherit; flex: 1; }
    .disc-song-arrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); flex-shrink: 0; }
    a.disc-song-row:hover .disc-song-arrow { color: var(--red); }

    .disc-note { font-size: 11px; color: #555; line-height: 1.6; }

    .track-grid { display: grid; grid-template-columns: 1fr; margin-top: 20px; border: 1px solid var(--border); }
    .track-row { display: flex; align-items: center; gap: 10px; padding: 9px 1.25rem; border-bottom: 1px solid #f0f0f0; }

    .track-num  { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #bbb; width: 22px; flex-shrink: 0; }

    .track-detail-btn { width: 24px; height: 24px; background: var(--red); border: none; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: background 0.12s; }
    .track-detail-btn:hover { background: #c0251b; }

  <script>
  let GROUPS = [];

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appleMusicId(url) {
    if (!url) return '';
    const m = url.match(/(\d+)(?:\?.*)?$/);
    return m ? m[1] : '';
  }

  function songHref(yt, am, ext) {
    const params = new URLSearchParams({ src: 'srvvinci' });
    if (yt) params.set('yt', yt);
    if (am) params.set('am', am);
    if (ext) params.set('ext', ext);
    return `song.html?${params.toString()}`;
  }

  function buildTrackGrid(tracks) {
    if (!tracks || !tracks.length) return `<div class="tbd">トラックリスト準備中</div>`;
    return `<div class="track-grid">${tracks.map(t => {
      const numTitle = `
          <span class="track-num">${String(t.num).padStart(2,'0')}</span>
          <span class="track-title">${escH(t.title)}</span>`;
      const href = t.yt ? songHref(t.yt) : (t.appleMusic ? songHref(null, appleMusicId(t.appleMusic)) : (t.externalVideo ? songHref(null, null, t.externalVideo) : null));
      if (href) {
        return `
          <div class="track-row">
            <a class="track-link" href="${href}">${numTitle}</a>
            <a class="track-detail-btn" href="${href}" aria-label="楽曲詳細へ">→</a>
          </div>`;
      }
      return `
        <div class="track-row">
          <span class="track-link">${numTitle}</span>
        </div>`;
    }).join('')}</div>`;
  }

  function songRow(title, href) {
    const inner = `<span class="disc-song-title">${escH(title)}</span>${href ? `<span class="disc-song-arrow">楽曲詳細 →</span>` : ''}`;
    return href
      ? `<a class="disc-song-row" href="${href}">${inner}</a>`
      : `<div class="disc-song-row">${inner}</div>`;
  }

  function buildCard(item) {
    const hasTracks = !!(item.tracks && item.tracks.length);
    const embedsHtml = [
      item.yt ? `<div class="disc-embed" data-yt="${escH(item.yt)}"></div>` : '',
      item.yt2 ? `<div class="disc-embed" data-yt="${escH(item.yt2)}"></div>` : '',
    ].join('');

    if (hasTracks) {
      const hasDetail = true;
      const previewYt = item.type !== 'DEMO' ? (item.yt || ((item.tracks || []).find(t => t.yt) || {}).yt) : null;
      const previewEmbedHtml = previewYt ? `<div class="disc-embed" data-yt="${escH(previewYt)}"></div>` : '';
      const detailHtml = `<div class="disc-detail">
             <div class="disc-song-list">
               <a class="disc-song-row" href="album.html?src=srvvinci&album=${encodeURIComponent(item.title)}">
                 <span class="disc-song-title">${escH(item.title)}</span>
                 <span class="disc-song-arrow">→アルバム詳細へ</span>
               </a>
             </div>
             ${item.note ? `<div class="disc-note">${escH(item.note)}</div>` : ''}
             ${previewEmbedHtml}
             ${buildTrackGrid(item.tracks)}
           </div>`;
      return `
        <div class="disc-card" data-title="${escH(item.title)}">
          <div class="disc-card-head">
            <span class="disc-type-badge ${escH(item.type)}">${escH(item.type)}</span>
            ${item.year ? `<span class="disc-year">${escH(item.year)}</span>` : ''}
            <span class="disc-title">${escH(item.title)}</span>
            ${hasDetail ? `<span class="disc-toggle">▼</span>` : ''}
          </div>
          ${detailHtml}
        </div>`;
    }

    const rowHref = item.yt ? songHref(item.yt) : (item.externalVideo ? songHref(null, null, item.externalVideo) : null);
    const hasDetail = !!rowHref;
    const songListHtml = rowHref ? `<div class="disc-song-list">${songRow(item.title, rowHref)}</div>` : '';
    const detailHtml = hasDetail
      ? `<div class="disc-detail">${songListHtml}${embedsHtml}</div>`
      : '';
    return `
      <div class="disc-card" data-title="${escH(item.title)}">
        <div class="disc-card-head">
          <span class="disc-type-badge ${escH(item.type)}">${escH(item.type)}</span>
          ${item.year ? `<span class="disc-year">${escH(item.year)}</span>` : ''}
          <span class="disc-title">${escH(item.title)}</span>
          ${hasDetail ? `<span class="disc-toggle">▼</span>` : ''}
        </div>
        ${detailHtml}
      </div>`;
  }

  function buildGroupSection(group) {
    return `
      <section class="group-section">
        <div class="group-header">
          <h2 class="group-name">${escH(group.name)}</h2>
        </div>
        <div class="disc-grid">${group.items.map(buildCard).join('')}</div>
      </section>`;
  }

  function render() {
    const content = document.getElementById('discContent');
    content.innerHTML = GROUPS.map(buildGroupSection).join('');

    content.querySelectorAll('.disc-card').forEach(card => {
      const head = card.querySelector('.disc-card-head');
      const embeds = card.querySelectorAll('.disc-embed');
      head.addEventListener('click', () => {
        if (!card.querySelector('.disc-detail')) return;
        const isOpen = card.classList.toggle('expanded');
        embeds.forEach(embed => {
          embed.innerHTML = isOpen
            ? `<iframe src="https://www.youtube.com/embed/${embed.dataset.yt}?rel=0&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`
            : '';
        });
      });
    });
  }

  function sortKey(year) {
    if (!year || year === '—') return '0000.00.00';
    const parts = String(year).split('.');
    const y = (parts[0] || '0000').padStart(4, '0');
    const m = (parts[1] || '06').padStart(2, '0');
    const d = (parts[2] || '15').padStart(2, '0');
    return `${y}.${m}.${d}`;
  }

  function buildGroups(groups) {
    return groups
      .filter(group => (group.demos || []).length || (group.singles || []).length || (group.albums || []).length)
      .map(group => {
        const items = [
          ...(group.demos || []).map(d => ({ ...d, type: d.type || 'DEMO', group: group.name })),
          ...(group.singles || []).map(d => ({ ...d, type: d.type || 'SINGLE', group: group.name })),
          ...(group.albums || []).map(a => ({ ...a, type: a.type || 'ALBUM', group: group.name })),
        ].sort((a, b) => sortKey(b.year).localeCompare(sortKey(a.year)));
        return { name: group.name, desc: group.desc, items };
      });
  }

  function focusAlbumFromQuery() {
    const albumTitle = new URLSearchParams(location.search).get('album');
    if (!albumTitle) return;
    const card = [...document.querySelectorAll('.disc-card')]
      .find(c => c.dataset.title === albumTitle);
    if (!card) return;
    card.classList.add('expanded');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  fetch('data/srvvinci-discography.json')
    .then(res => res.json())
    .then(data => {
      GROUPS = buildGroups(data.groups || []);
      render();
      focusAlbumFromQuery();
    })
    .catch(err => {
      document.getElementById('discContent').textContent = 'データの読み込みに失敗しました。';
      console.error(err);
    });
  </script>
