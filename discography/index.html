<html lang="ja">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #e63329; --black: #111; --white: #fff; --gray: #888; --border: #ddd; --bg: #fbf2d9; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--black); line-height: 1.6; padding-bottom: 58px; }
    a { color: inherit; text-decoration: none; }

    .nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 52px; }
    .nav-logo { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
    .nav-logo .red { color: var(--red); }
    .nav-links { display: flex; gap: 1.75rem; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
    .nav-links a { color: var(--gray); transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--black); }
    .nav-links a.active { border-bottom: 1px solid var(--black); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--white); border-top: 2px solid var(--black); z-index: 200; }
    .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; color: var(--gray); transition: color 0.15s; }
    .bn-item:hover { color: var(--black); }
    .bn-item.active { color: var(--red); }
    .bn-icon { font-size: 18px; line-height: 1; }

    .page-header { padding: 3rem 2rem 2.5rem; border-bottom: 2px solid var(--black); background: var(--white); }
    .page-header-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--gray); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .page-header-tag::before { content: ''; display: inline-block; width: 20px; height: 2px; background: var(--red); }
    .page-header-title { font-family: 'Zen Antique', serif; font-size: 64px; line-height: 1; letter-spacing: -0.02em; }
    .page-header-title .red { color: var(--red); }
    .page-header-desc { font-size: 12px; color: var(--gray); margin-top: 1rem; letter-spacing: 0.05em; }
    .page-header-actions { display: flex; gap: 10px; margin-top: 1.25rem; }
    .header-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid var(--black); padding: 8px 18px; background: var(--black); color: var(--white); transition: background 0.15s; }
    .header-btn:hover { background: var(--red); border-color: var(--red); }

    .filter-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 1.1rem 2rem; display: flex; flex-direction: column; gap: 0.9rem; }
    .filter-row { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
    .filter-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--gray); width: 46px; flex-shrink: 0; padding-top: 6px; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
    .filter-chip { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 6px 14px; border: 1px solid var(--border); background: var(--white); color: var(--gray); cursor: pointer; transition: all 0.15s; }
    .filter-chip:hover { border-color: var(--black); color: var(--black); }
    .filter-chip.active { background: var(--black); color: var(--white); border-color: var(--black); }
    .filter-chip.active:hover { background: var(--red); border-color: var(--red); }
    .filter-reset { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); background: none; border: none; cursor: pointer; text-decoration: underline; padding-top: 6px; flex-shrink: 0; }
    .filter-reset:hover { color: var(--red); }
    .filter-count { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); }

    .content { max-width: 1600px; margin: 0 auto; padding: 2rem; }

    .disc-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

    .disc-card { background: var(--white); border: 1px solid var(--border); }
    .disc-card.hidden { display: none; }

    .disc-card-head { display: flex; align-items: center; gap: 12px; padding: 1rem 1.25rem; cursor: pointer; }
    .disc-card-head:hover { background: var(--bg); }

    .disc-type-badge { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--white); padding: 2px 8px; display: inline-block; width: fit-content; flex-shrink: 0; }
    .disc-type-badge.ALBUM  { background: var(--red); }
    .disc-type-badge.CDSG   { background: #444; }
    .disc-type-badge.配信SG { background: #0a84c4; }
    .disc-type-badge.EP     { background: #2255cc; }
    .disc-type-badge.COVER  { background: #119944; }
    .disc-type-badge.INDIE      { background: #888; }
    .disc-type-badge.UNRELEASED { background: #7c3aed; }
    .disc-type-badge.Blu-ray { background: #b8860b; }
    .disc-card-external { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gray); flex-shrink: 0; }

    .disc-year  { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); flex-shrink: 0; }
    .disc-title { font-size: 15px; font-weight: 700; color: var(--black); line-height: 1.3; flex: 1; }
    .disc-note  { font-size: 11px; color: #555; line-height: 1.6; }

    .disc-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); flex-shrink: 0; transition: transform 0.15s; }
    .disc-card.expanded .disc-toggle { transform: rotate(180deg); }

    .disc-detail { display: none; padding: 0 1.25rem 1.25rem; }
    .disc-card.expanded .disc-detail { display: block; }
    .disc-detail-link { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--white); background: var(--black); padding: 6px 14px; margin-top: 10px; transition: background 0.15s; }
    .disc-detail-link:hover { background: var(--red); }
    .disc-song-list { background: var(--white); border: 1px solid var(--border); margin-top: 10px; }
    .disc-song-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; transition: background 0.12s, color 0.12s; }
    .disc-song-row:last-child { border-bottom: none; }
    a.disc-song-row { cursor: pointer; }
    a.disc-song-row:hover { background: var(--bg); color: var(--red); }
    .disc-song-title { font-size: 14px; font-weight: 700; color: inherit; flex: 1; }
    .disc-song-arrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); flex-shrink: 0; }
    a.disc-song-row:hover .disc-song-arrow { color: var(--red); }
    .disc-embed { margin-top: 20px; }
    .disc-embed iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

    .track-grid { display: grid; grid-template-columns: 1fr; margin: 10px -1.25rem 0; }
    .track-row { display: flex; align-items: center; gap: 10px; padding: 9px 1.25rem; border-bottom: 1px solid #f0f0f0; }
    .track-row:last-child { border-bottom: none; }
    .track-link { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    a.track-link:hover .track-title { color: var(--red); }
    .track-num  { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #bbb; width: 22px; flex-shrink: 0; }
    .track-title { font-size: 12px; font-weight: 500; flex: 1; transition: color 0.12s; }
    .track-detail-btn { width: 24px; height: 24px; background: var(--red); border: none; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: background 0.12s; }
    .track-detail-btn:hover { background: #c0251b; }

    .footer { padding: 2rem; border-top: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; background: var(--white); margin-top: 2rem; }
    .footer-logo { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; }
    .footer-logo .red { color: var(--red); }
    .footer-copy { font-size: 10px; color: var(--gray); letter-spacing: 0.05em; text-align: right; }
    .footer-copy a { text-decoration: underline; text-underline-offset: 2px; }
    .footer-copy a:hover { color: var(--red); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .page-header-title { font-size: 44px; }
      .disc-grid { gap: 12px; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

      <a href="../members/">メンバー</a>

    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-tag">DISCOGRAPHY</div>
    <h1 class="page-header-title">Discography<span class="red">.</span></h1>
    <p class="page-header-desc">King Gnu 名義の全シングル・アルバムを収録。</p>
    <div class="page-header-actions">
      <a href="../srvvinci-discography/" class="header-btn">King Gnu以前のディスコグラフィー →</a>
      <a href="../stats/" class="header-btn">ライブ・楽曲統計を見る →</a>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-label">TYPE</div>
      <div class="filter-chips" id="typeFilters"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">YEAR</div>
      <div class="filter-chips" id="yearFilters"></div>
      <button type="button" class="filter-reset" id="filterReset">リセット</button>
    </div>
    <div class="filter-count" id="filterCount"></div>
  </div>

  <div class="content" id="discContent"></div>

  <footer class="footer">
    <a href="../" class="footer-logo">Fan<span class="red">GNU</span></a>
    <div class="footer-copy">
      非公式ファンサイト。King Gnuおよび関係各社とは一切関係ありません。<br>
      <a href="../privacy/">プライバシーポリシー</a> ／ <a href="../contact/">お問い合わせ</a> ／ © FanGNU Unofficial
    </div>
  </footer>

  <script>
  let DISCS = [];

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function formatNote(value) {
    return escH(value).replace(/\n/g, '<br>');
  }

  function songHref(yt, ext, sp) {
    const params = new URLSearchParams();
    if (yt) params.set('yt', yt);
    else if (ext) params.set('ext', ext);
    else if (sp) params.set('sp', sp);
    else return null;
    return `../song/?${params.toString()}`;
  }

  function sortKey(year) {
    if (!year || year === '—') return '0000.00.00';
    const parts = String(year).split('.');
    const y = (parts[0] || '0000').padStart(4, '0');
    const m = (parts[1] || '06').padStart(2, '0');
    const d = (parts[2] || '15').padStart(2, '0');
    return `${y}.${m}.${d}`;
  }

  function buildTrackGrid(tracks) {
    return `<div class="track-grid">${tracks.map(t => {
      const numTitle = `
          <span class="track-num">${String(t.num).padStart(2,'0')}</span>
          <span class="track-title">${escH(t.displayTitle || t.title)}</span>`;
      const href = songHref(t.yt, t.externalVideo, t.spotify);
      const link = href
        ? `<a class="track-link" href="${href}">${numTitle}</a>`
        : `<span class="track-link">${numTitle}</span>`;
      return `
        <div class="track-row">
          ${link}
          ${href ? `<a class="track-detail-btn" href="${href}" aria-label="楽曲詳細へ">→</a>` : ''}
        </div>`;
    }).join('')}</div>`;
  }

  function buildCard(item) {
    const isAlbum = item.type === 'ALBUM';

    if (item.discs) {
      const href = `../video/?title=${encodeURIComponent(item.title)}`;
      return `
        <a class="disc-card" data-type="${escH(item.type)}" data-year="${escH(item.yearKey)}" href="${href}">
          <div class="disc-card-head">
            <span class="disc-type-badge ${escH(item.type)}">${escH(item.type)}</span>
            <span class="disc-year">${escH(item.year)}</span>
            <span class="disc-title">${escH(item.title)}</span>
            <span class="disc-card-external">→</span>
          </div>
        </a>`;
    }

    if (isAlbum) {
      const detailHtml = `<div class="disc-detail">
          <div class="disc-song-list">
            <a class="disc-song-row" href="../album/?album=${encodeURIComponent(item.title)}">
              <span class="disc-song-title">${escH(item.title)}</span>
              <span class="disc-song-arrow">→アルバム詳細へ</span>
            </a>
          </div>
          ${item.teaserYt ? `<div class="disc-embed" data-yt="${escH(item.teaserYt)}"></div>` : ''}
          ${item.note ? `<div class="disc-note">${formatNote(item.note)}</div>` : ''}
          ${buildTrackGrid(item.tracks || [])}
        </div>`;
      return `
        <div class="disc-card" data-type="ALBUM" data-year="${escH(item.yearKey)}" data-title="${escH(item.title)}">
          <div class="disc-card-head">
            <span class="disc-type-badge ALBUM">ALBUM</span>
            <span class="disc-year">${escH(item.year)}</span>
            <span class="disc-title">${escH(item.title)}</span>
            <span class="disc-toggle">▼</span>
          </div>
          ${detailHtml}
        </div>`;
    }

    const hasDetail = !!(item.note || item.yt || item.externalVideo || item.spotify || item.coupling);
    const songRow = (title, yt, ext, sp) => {
      const href = songHref(yt, ext, sp);
      const inner = `<span class="disc-song-title">${escH(title)}</span>${href ? `<span class="disc-song-arrow">楽曲詳細 →</span>` : ''}`;
      return href
        ? `<a class="disc-song-row" href="${href}">${inner}</a>`
        : `<div class="disc-song-row">${inner}</div>`;
    };
    const songRowsHtml = [
      (item.yt || item.externalVideo || item.spotify) ? songRow(item.title, item.yt, item.externalVideo, item.spotify) : '',
      item.coupling ? songRow(item.coupling.title, item.coupling.yt, item.coupling.externalVideo, item.coupling.spotify) : '',
    ].join('');
    const songListHtml = songRowsHtml ? `<div class="disc-song-list">${songRowsHtml}</div>` : '';
    const detailHtml = hasDetail
      ? `<div class="disc-detail">
           ${item.note ? `<div class="disc-note">${formatNote(item.note)}</div>` : ''}
           ${songListHtml}
           ${item.yt ? `<div class="disc-embed" data-yt="${escH(item.yt)}"></div>` : ''}
           ${item.coupling && item.coupling.yt ? `<div class="disc-embed" data-yt="${escH(item.coupling.yt)}"></div>` : ''}
         </div>`
      : '';
    return `
      <div class="disc-card" data-type="${escH(item.type)}" data-year="${escH(item.yearKey)}">
        <div class="disc-card-head">
          <span class="disc-type-badge ${escH(item.type)}">${escH(item.type)}</span>
          <span class="disc-year">${escH(item.year)}</span>
          <span class="disc-title">${escH(item.displayTitle || item.title)}</span>
          ${hasDetail ? `<span class="disc-toggle">▼</span>` : ''}
        </div>
        ${detailHtml}
      </div>`;
  }

  let selectedTypes = new Set();
  let selectedYears = new Set();

  function render() {
    const content = document.getElementById('discContent');
    content.innerHTML = `<div class="disc-grid">${DISCS.map(buildCard).join('')}</div>`;

    applyFilter();

    content.querySelectorAll('.disc-card').forEach(card => {
      const head = card.querySelector('.disc-card-head');
      const embeds = card.querySelectorAll('.disc-embed');
      head.addEventListener('click', () => {
        if (!card.querySelector('.disc-detail')) return;
        const isOpen = card.classList.toggle('expanded');
        embeds.forEach(embed => {
          embed.innerHTML = isOpen
            ? `<iframe src="https://www.youtube.com/embed/${escH(embed.dataset.yt)}?rel=0&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`
            : '';
        });
      });
    });
  }

  function applyFilter() {
    let total = 0;
    document.querySelectorAll('.disc-card').forEach(card => {
      const match = (selectedTypes.size === 0 || selectedTypes.has(card.dataset.type)) &&
        (selectedYears.size === 0 || selectedYears.has(card.dataset.year));
      card.classList.toggle('hidden', !match);
      if (match) total++;
    });
    document.getElementById('filterCount').textContent = `${total} / ${DISCS.length} 件`;
  }

  function buildChipGroup(containerId, values, selectedSet) {
    const container = document.getElementById(containerId);
    container.innerHTML = values.map(v =>
      `<button type="button" class="filter-chip" data-value="${escH(v)}">${escH(v)}</button>`
    ).join('');
    container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const v = chip.dataset.value;
        chip.classList.toggle('active');
        if (chip.classList.contains('active')) selectedSet.add(v);
        else selectedSet.delete(v);
        applyFilter();
      });
    });
  }

  const TYPE_ORDER = ['ALBUM', '配信SG', 'CDSG', 'COVER', 'Blu-ray'];

  function initFilters() {
    const types = [...new Set(DISCS.map(i => i.type))].sort((a, b) => {
      const ai = TYPE_ORDER.indexOf(a);
      const bi = TYPE_ORDER.indexOf(b);
      if (ai === -1 && bi === -1) return a.localeCompare(b);
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });
    const years = [...new Set(DISCS.map(i => i.yearKey).filter(Boolean))].sort((a, b) => b.localeCompare(a));
    selectedTypes = new Set();
    selectedYears = new Set();
    buildChipGroup('typeFilters', types, selectedTypes);
    buildChipGroup('yearFilters', years, selectedYears);

    document.getElementById('filterReset').addEventListener('click', () => {
      selectedTypes.clear();
      selectedYears.clear();
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      applyFilter();
    });
  }

  function focusAlbumFromQuery() {
    const albumTitle = new URLSearchParams(location.search).get('album');
    if (!albumTitle) return;
    const card = [...document.querySelectorAll('.disc-card[data-type="ALBUM"]')]
      .find(c => c.dataset.title === albumTitle);
    if (!card) return;
    card.classList.add('expanded');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // データ読み込み → 初期描画
  fetch('../data/kinggnu-discography.json')
    .then(res => res.json())
    .then(data => {
      const items = (data.items || []).filter(i => i.type !== 'UNRELEASED').map(i => ({ ...i }));
      const albums = (data.albums || []).map(a => ({ ...a, type: 'ALBUM' }));
      DISCS = [...items, ...albums].sort((a, b) => sortKey(b.year).localeCompare(sortKey(a.year)));
      DISCS.forEach(item => {
        const m = String(item.year || '').match(/^\d{4}/);
        item.yearKey = m ? m[0] : '';
      });
      initFilters();
      render();
      focusAlbumFromQuery();
    })
    .catch(err => {
      document.getElementById('discContent').textContent = 'データの読み込みに失敗しました。';
      console.error(err);
    });
  </script>

  <nav class="bottom-nav">
    <a href="../" class="bn-item"><span class="bn-icon">🏠</span>ホーム</a>
    <a href="./" class="bn-item active"><span class="bn-icon">💿</span>ディスコグラフィー</a>
    <a href="../members/" class="bn-item"><span class="bn-icon">👥</span>メンバー</a>
    <a href="../stats/" class="bn-item"><span class="bn-icon">📊</span>統計</a>
    <a href="../live/" class="bn-item"><span class="bn-icon">🎤</span>ライブ</a>
  </nav>

</body>
</html>
