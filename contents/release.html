    .lyrics-btn:hover { background: var(--red); }

    .content { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--gray); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: inline-block; width: 16px; height: 2px; background: var(--red); }

    .release-info { background: var(--white); border: 1px solid var(--border); }
    .release-info-row { display: flex; gap: 16px; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); }
    .release-info-row:last-child { border-bottom: none; }
    .release-info-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray); width: 110px; flex-shrink: 0; padding-top: 2px; }
    .release-info-value { font-size: 13px; color: var(--black); line-height: 1.7; }
    .release-info-value.empty { color: var(--gray); }
    .release-info-value a { text-decoration: underline; text-underline-offset: 2px; transition: color 0.12s; }
    .release-info-value a:hover { color: var(--red); }

    .disc-block { background: var(--white); border: 1px solid var(--border); }
    .disc-block-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg); }
    .disc-track-row { display: flex; align-items: center; gap: 12px; padding: 8px 1.25rem; border-bottom: 1px solid #f0f0f0; font-size: 13px; }

  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setInfo(id, value) {
    const el = document.getElementById(id);
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function setExtra(id, value) {
    const el = document.getElementById(id);
    if (!value) {
      el.textContent = '-';
      el.classList.add('empty');
      return;
    }
    const parts = value.split(/(\[[^\]]+\]\([^)]+\))/g);
    el.innerHTML = parts.map(part => {
      const m = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (!m) return escH(part).replace(/\n/g, '<br>');
      const isExternal = /^https?:\/\//.test(m[2]);
      return isExternal
        ? `<a href="${escH(m[2])}" target="_blank" rel="noopener">${escH(m[1])}</a>`
        : `<a href="${escH(m[2])}">${escH(m[1])}</a>`;
    }).join('');
    el.classList.remove('empty');
  }

  function renderDiscs(discs) {
    const area = document.getElementById('discsArea');
    if (!discs || !discs.length) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = discs.map(disc => `
      <div class="section-label">${escH(disc.label || '')}</div>
      <div class="disc-block">
        ${(disc.tracks || []).map((t, i) => `
          <div class="disc-track-row">
            <span class="disc-track-num">${String(i + 1).padStart(2,'0')}</span>
            <span>${escH(t)}</span>
          </div>`).join('')}
      </div>`).join('<div style="height:1.25rem"></div>');
  }

  function renderRelease(release) {
    document.title = `${release.title} — FanGNU`;

    const typeBadge = document.getElementById('typeBadge');
    if (release.type) {
      typeBadge.textContent = release.type;
      typeBadge.classList.add(release.type);
    } else {
      typeBadge.style.display = 'none';
    }

    document.getElementById('releaseTitle').textContent = release.title || '（タイトル不明）';
    setInfo('infoYear', release.year);
    setExtra('infoExtra', release.extra);
    renderDiscs(release.discs);

    const purchaseLink = document.getElementById('purchaseLink');
    if (release.purchaseUrl) {
      purchaseLink.href = release.purchaseUrl;
      purchaseLink.style.display = '';
    } else {
      purchaseLink.style.display = 'none';
    }
  }

  function renderNotFound() {
    document.getElementById('releaseTitle').textContent = 'リリースが見つかりませんでした';
    document.getElementById('typeBadge').style.display = 'none';
    setInfo('infoYear', '');
    setExtra('infoExtra', '');
    renderDiscs([]);
  }

  const params = new URLSearchParams(location.search);
  const title = params.get('title') || '';

  fetch('data/kinggnu-discography.json')
    .then(res => res.json())
    .then(data => {
      const release = (data.items || []).find(i => i.title === title && i.discs);
      if (!release) { renderNotFound(); return; }
      renderRelease(release);
    })
    .catch(err => {
      console.error(err);
      renderNotFound();
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = 'discography.html';
    }
  });
  </script>
