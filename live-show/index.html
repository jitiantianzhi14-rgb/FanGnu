  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function normalizeTitle(title) {
    return title
      .replace(/\s*★.*$/, '')
      .replace(/[（(][^）)]*[）)]\s*$/, '')
      .trim();
  }

  function resolveSongInfo(title, songIndex) {
    if (songIndex.has(title)) return songIndex.get(title);
    const norm = normalizeTitle(title);
    if (norm !== title && songIndex.has(norm)) return songIndex.get(norm);
    return null;
  }

  function songHref(info) {
    return info && info.slug ? `../song/?slug=${encodeURIComponent(info.slug)}` : null;
  }

  function buildKgEntries(data) {
    const entries = [];
    (data.items || []).forEach(item => {
      entries.push([item.title, { slug: item.slug || '', src: 'discography' }]);
      if (item.coupling && item.coupling.title) entries.push([item.coupling.title, { slug: item.coupling.slug || '', src: 'discography' }]);
    });
    // 通常盤を優先し、ライブアルバムは音源がない曲を補うフォールバックとして最後に処理する
    const kgAlbums = data.albums || [];
    const studioAlbums = kgAlbums.filter(a => a.note !== 'ライブアルバム');
    const liveAlbums = kgAlbums.filter(a => a.note === 'ライブアルバム');
    [...studioAlbums, ...liveAlbums].forEach(album => {
      (album.tracks || []).forEach(t => entries.push([t.title, { slug: t.slug || '', src: 'discography' }]));
    });
    return entries;
  }

  function buildSvEntries(data) {
    const entries = [];
    (data.groups || []).forEach(group => {
      const flatItems = [
        ...(group.demos || []).filter(d => !d.tracks),
        ...(group.singles || []).filter(d => !d.tracks),
      ];
      flatItems.forEach(d => entries.push([d.title, { slug: d.slug || '', src: 'srvvinci' }]));

      const collections = [
        ...(group.demos || []).filter(d => d.tracks),
        ...(group.singles || []).filter(d => d.tracks),
        ...(group.albums || []),
      ];
      collections.forEach(coll => {
        (coll.tracks || []).forEach(t => entries.push([t.title, { slug: t.slug || '', src: 'srvvinci' }]));
      });
    });
    return entries;
  }

  // 曲名インデックスは常に King Gnu / Srv.Vinci 両方のディスコグラフィーを合成する
  // （King Gnu名義のライブでもSrv.Vinci時代の楽曲が演奏されているケースがあるため）。
  // isSrvvinciはどちらのカタログを優先して名前を解決するかの判定にのみ使う。
  async function loadSongIndex(isSrvvinci) {
    const index = new Map();
    const addSong = (title, entry) => { if (!index.has(title)) index.set(title, entry); };
    try {
      const [kgRes, svRes] = await Promise.all([
        fetch('../data/kinggnu-discography.json'),
        fetch('../data/srvvinci-discography.json'),
      ]);
      const kgEntries = buildKgEntries(await kgRes.json());
      const svEntries = buildSvEntries(await svRes.json());
      const ordered = isSrvvinci ? [...svEntries, ...kgEntries] : [...kgEntries, ...svEntries];
      ordered.forEach(([title, entry]) => addSong(title, entry));
    } catch (err) {
      console.error(err);
    }
    return index;
  }

  const VIDEO_INITIAL_COUNT = 4;

  function buildVideoItem(video, title) {
    return `
      <div class="video-item">
        ${video.songs ? `<div class="video-label">${escH(video.songs)}</div>` : ''}
        <div class="mv-thumb-wrap" data-yt="${escH(video.yt)}">
          <img src="https://img.youtube.com/vi/${escH(video.yt)}/maxresdefault.jpg" alt="${escH(title)} ライブ映像" loading="lazy">
          <div class="mv-thumb-play"><div class="mv-thumb-play-btn"></div></div>
        </div>
        <div class="mv-embed"></div>
      </div>`;
  }

  function wireVideoItem(item) {
    const yt = item.querySelector('.mv-thumb-wrap').dataset.yt;
    const thumbImg = item.querySelector('.mv-thumb-wrap img');
    thumbImg.addEventListener('load', () => {
      if (thumbImg.naturalWidth === 120) thumbImg.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
    });
    thumbImg.addEventListener('error', () => {
      thumbImg.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
    });
    item.querySelector('.mv-thumb-wrap').addEventListener('click', () => {
      const thumb = item.querySelector('.mv-thumb-wrap');
      const embed = item.querySelector('.mv-embed');
      thumb.style.display = 'none';
      embed.classList.add('open');
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${escH(yt)}?rel=0&autoplay=1&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
    });
  }

  function renderMedia(videos, title) {
    const mediaArea = document.getElementById('mediaArea');
    if (!videos || !videos.length) {
      mediaArea.innerHTML = '';
      return;
    }
    const initial = videos.slice(0, VIDEO_INITIAL_COUNT);
    const rest = videos.slice(VIDEO_INITIAL_COUNT);

    mediaArea.innerHTML = initial.map(v => buildVideoItem(v, title)).join('');
    mediaArea.querySelectorAll('.video-item').forEach(wireVideoItem);

    if (rest.length) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'video-more-btn';
      btn.textContent = `もっと表示（他${rest.length}件）`;
      btn.addEventListener('click', () => {
        btn.insertAdjacentHTML('beforebegin', rest.map(v => buildVideoItem(v, title)).join(''));
        Array.from(mediaArea.querySelectorAll('.video-item')).slice(initial.length).forEach(wireVideoItem);
        btn.remove();
      });
      mediaArea.appendChild(btn);
    }
  }

  let shortsData = [];
  let shortsIndex = 0;

  function wireShortsThumb(thumb) {
    thumb.addEventListener('click', () => {
      const yt = thumb.dataset.yt;
      const embed = thumb.nextElementSibling;
      thumb.style.display = 'none';
      embed.classList.add('open');
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${escH(yt)}?rel=0&autoplay=1&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
    });
  }

  function renderShortsPage() {
    const grid = document.getElementById('shortsGrid');
    const pageInfo = document.getElementById('shortsPageInfo');
    const len = shortsData.length;
    const count = Math.min(2, len);
    const items = [];
    for (let i = 0; i < count; i++) items.push(shortsData[(shortsIndex + i) % len]);

    grid.innerHTML = items.map(yt => `
      <div class="shorts-thumb" data-yt="${escH(yt)}">
        <img src="https://img.youtube.com/vi/${escH(yt)}/maxresdefault.jpg" alt="behind the scenes" loading="lazy">
        <div class="mv-thumb-play"><div class="mv-thumb-play-btn"></div></div>
      </div>
      <div class="shorts-embed"></div>`).join('');
    grid.querySelectorAll('.shorts-thumb').forEach(thumb => {
      wireShortsThumb(thumb);
      const yt = thumb.dataset.yt;
      const img = thumb.querySelector('img');
      img.addEventListener('load', () => {
        if (img.naturalWidth === 120) img.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
      });
      img.addEventListener('error', () => {
        img.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
      });
    });

    if (pageInfo) pageInfo.textContent = `${shortsIndex + 1} / ${len}`;
  }

  function renderShorts(shorts) {
    const area = document.getElementById('shortsArea');
    if (!shorts || !shorts.length) {
      area.innerHTML = '';
      return;
    }
    shortsData = shorts;
    shortsIndex = 0;
    const needsNav = shorts.length > 2;

    area.innerHTML = `
      <div class="section-label">SHORTS</div>
      <div class="shorts-grid${shorts.length === 1 ? ' single' : ''}" id="shortsGrid"></div>
      ${needsNav ? `
      <div class="shorts-controls">
        <button type="button" class="shorts-nav-btn" id="shortsPrev" aria-label="前へ">←</button>
        <span class="shorts-page-info" id="shortsPageInfo"></span>
        <button type="button" class="shorts-nav-btn" id="shortsNext" aria-label="次へ">→</button>
      </div>` : ''}`;

    if (needsNav) {
      document.getElementById('shortsPrev').addEventListener('click', () => {
        shortsIndex = (shortsIndex - 1 + shortsData.length) % shortsData.length;
        renderShortsPage();
      });
      document.getElementById('shortsNext').addEventListener('click', () => {
        shortsIndex = (shortsIndex + 1) % shortsData.length;
        renderShortsPage();
      });
    }

    renderShortsPage();
  }

  function spotifyPlaylistId(url) {
    if (!url) return '';
    const m = url.match(/playlist\/([a-zA-Z0-9]+)/);
    return m ? m[1] : '';
  }

  function renderSpotifyPlaylist(url) {
    const area = document.getElementById('spotifyArea');
    const id = spotifyPlaylistId(url);
    if (!id) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = `
      <div class="section-label">SETLIST PLAYLIST</div>
      <div class="spotify-embed">
        <iframe src="https://open.spotify.com/embed/playlist/${id}?utm_source=generator"
          height="352" loading="lazy"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>`;
  }

  function renderSetlist(setlist, songIndex) {
    const area = document.getElementById('setlistArea');
    if (!setlist || !setlist.length) {
      area.innerHTML = `<div class="no-setlist">セットリスト情報はまだありません。</div>`;
      return;
    }
    area.innerHTML = `
      <div class="section-label">SETLIST</div>
      <ol class="setlist-list">${setlist.map((s, i) => {
        const info = resolveSongInfo(s, songIndex);
        const href = info ? songHref(info) : null;
        const inner = `<span class="setlist-num">${String(i + 1).padStart(2, '0')}</span><span class="setlist-title">${escH(s)}</span>${href ? `<span class="setlist-detail-btn" aria-hidden="true">→</span>` : ''}`;
        return href
          ? `<li class="setlist-item"><a class="setlist-row" href="${href}">${inner}</a></li>`
          : `<li class="setlist-item"><span class="setlist-row">${inner}</span></li>`;
      }).join('')}</ol>`;
  }

  // ---- カスタムツールチップ ----
  const tooltipEl = document.createElement('div');
  tooltipEl.className = 'chart-tooltip';
  tooltipEl.innerHTML = '<div class="tt-value"></div><div class="tt-label"></div>';
  document.body.appendChild(tooltipEl);
  const tooltipValueEl = tooltipEl.querySelector('.tt-value');
  const tooltipLabelEl = tooltipEl.querySelector('.tt-label');

  function showTooltip(x, y, value, label) {
    tooltipValueEl.textContent = value;
    tooltipLabelEl.textContent = label;
    const spaceRight = window.innerWidth - x;
    const offsetX = spaceRight < 160 ? -12 - tooltipEl.offsetWidth : 12;
    tooltipEl.style.left = `${x + offsetX}px`;
    tooltipEl.style.top = `${y + 16}px`;
    tooltipEl.classList.add('visible');
  }

  function hideTooltip() {
    tooltipEl.classList.remove('visible');
  }

  function bindTooltips(container) {
    container.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      const mark = e.target.closest('[data-tt-value]');
      if (!mark) { hideTooltip(); return; }
      showTooltip(e.clientX, e.clientY, mark.dataset.ttValue, mark.dataset.ttLabel);
    });
    container.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'touch') return;
      hideTooltip();
    });
  }
  document.addEventListener('click', (e) => {
    const mark = e.target.closest('[data-tt-value]');
    if (mark) showTooltip(e.clientX, e.clientY, mark.dataset.ttValue, mark.dataset.ttLabel);
    else hideTooltip();
  });

  // ---- 公演ごとのアルバム比率 ----
  const ALBUM_PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];

  function buildAlbumMap(kgDisco, svDisco) {
    const songAlbum = new Map();

    const itemTitleByYt = new Map();
    (kgDisco.items || []).forEach(item => {
      if (item.yt) itemTitleByYt.set(item.yt, item.title);
      if (item.coupling && item.coupling.yt) itemTitleByYt.set(item.coupling.yt, item.coupling.title);
    });

    const studioAlbums = (kgDisco.albums || []).filter(a => a.note !== 'ライブアルバム');
    studioAlbums.forEach(album => {
      (album.tracks || []).forEach(t => {
        const canonicalTitle = (t.yt && itemTitleByYt.get(t.yt)) || t.title;
        const key = normalizeTitle(canonicalTitle);
        if (!songAlbum.has(key)) songAlbum.set(key, album.title);
      });
    });

    (svDisco.groups || []).forEach(group => {
      const titles = [];
      [...(group.demos || []), ...(group.singles || []), ...(group.albums || [])].forEach(coll => {
        if (coll.tracks) coll.tracks.forEach(t => titles.push(t.title));
        else titles.push(coll.title);
      });
      titles.forEach(title => {
        const key = normalizeTitle(title);
        if (!songAlbum.has(key)) songAlbum.set(key, 'Srv.Vinci期');
      });
    });

    (kgDisco.items || []).forEach(item => {
      if (item.type === 'UNRELEASED') return;
      const key = normalizeTitle(item.title);
      if (!songAlbum.has(key)) songAlbum.set(key, 'シングル（アルバム未収録）');
      if (item.coupling) {
        const ck = normalizeTitle(item.coupling.title);
        if (!songAlbum.has(ck)) songAlbum.set(ck, 'シングル（アルバム未収録）');
      }
    });

    return songAlbum;
  }

  async function loadAlbumMap() {
    try {
      const [kgRes, svRes] = await Promise.all([
        fetch('../data/kinggnu-discography.json'),
        fetch('../data/srvvinci-discography.json'),
      ]);
      return buildAlbumMap(await kgRes.json(), await svRes.json());
    } catch (err) {
      console.error(err);
      return new Map();
    }
  }

  function renderAlbumRatio(setlist, songAlbum) {
    const area = document.getElementById('albumRatioArea');
    if (!setlist || !setlist.length) {
      area.innerHTML = '';
      return;
    }

    const counts = new Map();
    setlist.forEach(s => {
      const label = songAlbum.get(normalizeTitle(s)) || 'その他/不明';
      counts.set(label, (counts.get(label) || 0) + 1);
    });

    const total = setlist.length;
    const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);

    area.innerHTML = `
      <div class="section-label">ALBUM RATIO</div>
      <div class="stack-track">${sorted.map(([label, count], i) => {
        const pct = (count / total) * 100;
        return `<div class="stack-seg" style="width:${pct}%;background:${ALBUM_PALETTE[i % ALBUM_PALETTE.length]}" data-tt-value="${count}曲（${pct.toFixed(1)}%）" data-tt-label="${escH(label)}"></div>`;
      }).join('')}</div>
      <div class="chart-legend">${sorted.map(([label, count], i) => {
        const pct = (count / total) * 100;
        return `<div class="legend-item"><span class="legend-swatch" style="background:${ALBUM_PALETTE[i % ALBUM_PALETTE.length]}"></span>${escH(label)}（${count}曲・${pct.toFixed(1)}%）</div>`;
      }).join('')}</div>`;
    bindTooltips(area);
  }

  function setMetaContent(selector, content) {
    const el = document.querySelector(selector);
    if (el) el.setAttribute('content', content);
  }

  function renderShow(tour, show, songIndex, songAlbum) {
    const pageTitle = `${show.venue || show.location} — 公演詳細 — FunGNU`;
    document.title = pageTitle;
    const desc = `${show.date} ${tour.name}（${show.venue || show.location}）の公演詳細。セットリストなどをまとめて掲載。`;
    setMetaContent('meta[name="description"]', desc);
    setMetaContent('meta[property="og:title"]', pageTitle);
    setMetaContent('meta[property="og:description"]', desc);

    const badge = document.getElementById('statusBadge');
    if (show.status) {
      badge.textContent = show.status;
      badge.style.display = 'inline-block';
      if (show.status === 'SOLD OUT') badge.classList.add('sold');
    }

    document.getElementById('tourName').textContent = tour.name;
    document.getElementById('venueName').textContent = show.venue || '会場未定';
    document.getElementById('showDate').textContent = show.date;
    document.getElementById('address').textContent = show.location;

    renderMedia(show.videos, show.venue || tour.name);
    renderShorts(show.shorts);

    if (show.note) {
      const noteEl = document.getElementById('noteText');
      noteEl.textContent = `※${show.note}`;
      noteEl.style.display = 'block';
    }

    const mapQuery = [show.venue, show.location].filter(Boolean).join(' ').trim();
    const isOnline = (show.location || '').trim().toUpperCase() === 'ONLINE';
    if (mapQuery && !isOnline) {
      const mapArea = document.getElementById('mapArea');
      mapArea.innerHTML = `<iframe src="https://maps.google.com/maps?q=${encodeURIComponent(mapQuery)}&output=embed" loading="lazy" allowfullscreen></iframe>`;
      mapArea.style.display = 'block';
    }

    renderSpotifyPlaylist(show.spotifyPlaylist);
    renderSetlist(show.setlist, songIndex);
    renderAlbumRatio(show.setlist, songAlbum);
  }

  function renderNotFound() {
    document.getElementById('venueName').textContent = '公演情報が見つかりませんでした';
    renderMedia([], '');
    renderShorts([]);
    renderSpotifyPlaylist('');
    renderSetlist([], new Map());
    renderAlbumRatio([], new Map());
  }

  async function findShow(date, isSrvvinci) {
    const res = await fetch(isSrvvinci ? '../data/srvvinci-live.json' : '../data/kinggnu-live.json');
    const data = await res.json();
    for (const tour of data.tours) {
      const show = (tour.shows || []).find(s => s.date === date);
      if (show) return { tour, show };
    }
    return null;
  }

  const params = new URLSearchParams(location.search);
  const date = params.get('date') || '';
  const isSrvvinci = params.get('src') === 'srvvinci';
  const backHref = isSrvvinci ? '../srvvinci-live/' : '../live/';
  document.getElementById('archiveLink').href = backHref;

  Promise.all([findShow(date, isSrvvinci), loadSongIndex(isSrvvinci), loadAlbumMap()])
    .then(([result, songIndex, songAlbum]) => {
      if (result) renderShow(result.tour, result.show, songIndex, songAlbum);
      else renderNotFound();
    })
    .catch(err => {
      console.error(err);
      renderNotFound();
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = backHref;
    }
  });
  </script>
