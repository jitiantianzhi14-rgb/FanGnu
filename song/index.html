<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>楽曲詳細 — FunGNU</title>
  <meta name="description" content="King Gnu・Srv.Vinci時代の楽曲詳細ページ。MV・タイアップ情報・ライブ披露履歴などをまとめて掲載。">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>
  <p>移動しています… <a href="../discography/" id="fallbackLink">ディスコグラフィーへ</a></p>
  <script>
    var params = new URLSearchParams(location.search);
    var hashParams = new URLSearchParams(location.hash.slice(1));
    var slug = params.get('slug') || hashParams.get('slug') || '';
    if (slug) {
      location.replace('./' + encodeURIComponent(slug) + '/');
    } else {
      location.replace('../discography/');
    }
  </script>
</body>
</html>
