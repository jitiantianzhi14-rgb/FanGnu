<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>公演詳細 — FunGNU!!!</title>
  <meta name="description" content="King Gnu・Srv.Vinci時代のライブ公演詳細ページ。会場・セットリストなどをまとめて掲載。">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
  <p>移動しています… <a href="../live/" id="fallbackLink">ライブアーカイブへ</a></p>
  <script>
    var params = new URLSearchParams(location.search);
    var date = params.get('date') || '';
    var isSrvvinci = params.get('src') === 'srvvinci';
    if (date) {
      location.replace('./' + encodeURIComponent(date) + (isSrvvinci ? '-srvvinci' : '') + '/');
    } else {
      location.replace(isSrvvinci ? '../srvvinci-live/' : '../live/');
    }
  </script>
</body>
</html>
