<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲詳細 — FanGNU</title>
  <meta name="description" content="King Gnu・Srv.Vinci時代の楽曲詳細ページ。MV・タイアップ情報・ライブ披露履歴などをまとめて掲載。">
  <meta property="og:type" content="music.song">
  <meta property="og:site_name" content="FanGNU">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="楽曲詳細 — FanGNU">
  <meta property="og:description" content="King Gnu・Srv.Vinci時代の楽曲詳細ページ。MV・タイアップ情報・ライブ披露履歴などをまとめて掲載。">
  <meta property="og:url" content="https://jitiantianzhi14-rgb.github.io/FanGnu/contents/song.html">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Antique&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #e63329; --black: #111; --white: #fff; --gray: #888; --border: #ddd; --bg: #fbf2d9; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--black); line-height: 1.6; padding-bottom: 58px; }
    a { color: inherit; text-decoration: none; }

    .nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 52px; }
    .nav-logo { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
    .nav-logo .red { color: var(--red); }
    .nav-links { display: flex; gap: 1.75rem; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
    .nav-links a { color: var(--gray); transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--black); }
    .nav-links a.active { border-bottom: 1px solid var(--black); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--white); border-top: 2px solid var(--black); z-index: 200; }
    .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; color: var(--gray); transition: color 0.15s; }
    .bn-item:hover { color: var(--black); }
    .bn-item.active { color: var(--red); }
    .bn-icon { font-size: 18px; line-height: 1; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; margin: 1.25rem 2rem 0; padding: 0; background: none; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); cursor: pointer; }
    .back-link:hover { color: var(--black); }

    .page-header { padding: 0.75rem 2rem 2.5rem; border-bottom: 2px solid var(--black); background: var(--white); }
    .disc-type-badge { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--white); padding: 2px 8px; display: inline-block; width: fit-content; margin-bottom: 1rem; }
    .disc-type-badge.ALBUM  { background: var(--red); }
    .disc-type-badge.SINGLE { background: #444; }
    .disc-type-badge.CDSG   { background: #444; }
    .disc-type-badge.配信SG { background: #0a84c4; }
    .disc-type-badge.EP     { background: #2255cc; }
    .disc-type-badge.COVER  { background: #119944; }
    .disc-type-badge.INDIE      { background: #888; }
    .disc-type-badge.UNRELEASED { background: #7c3aed; }
    .disc-type-badge.DEMO       { background: #7c3aed; }
    .disc-type-badge.ミニアルバム { background: #e6942e; }

    .page-header-title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-header-title { font-family: 'Zen Antique', serif; font-size: 48px; line-height: 1.2; letter-spacing: -0.02em; }
    .lyrics-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; background: var(--black); color: var(--white); border: none; padding: 7px 16px; white-space: nowrap; text-decoration: none; transition: background 0.15s; }
    .lyrics-btn:hover { background: var(--red); }

    .content { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

    .mv-thumb-wrap { position: relative; cursor: pointer; }
    .mv-thumb-wrap img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .mv-thumb-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); transition: background 0.15s; }
    .mv-thumb-wrap:hover .mv-thumb-play { background: rgba(0,0,0,0.45); }
    .mv-thumb-play-btn { width: 56px; height: 56px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .mv-thumb-play-btn::after { content: ''; border-style: solid; border-width: 11px 0 11px 22px; border-color: transparent transparent transparent #fff; margin-left: 5px; }
    .mv-embed { display: none; }
    .mv-embed.open { display: block; }
    .mv-embed iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

    .shorts-wrap { display: flex; align-items: center; gap: 10px; }
    .shorts-nav-btn { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--black); background: var(--white); color: var(--black); cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .shorts-nav-btn:hover { background: var(--black); color: var(--white); }
    .shorts-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shorts-thumb { position: relative; cursor: pointer; }
    .shorts-thumb img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #000; }
    .shorts-thumb:hover .mv-thumb-play { background: rgba(0,0,0,0.45); }
    .shorts-thumb .mv-thumb-play-btn { width: 40px; height: 40px; }
    .shorts-thumb .mv-thumb-play-btn::after { border-width: 8px 0 8px 16px; margin-left: 3px; }
    .shorts-embed { display: none; }
    .shorts-embed.open { display: block; }
    .shorts-embed iframe { width: 100%; aspect-ratio: 9/16; border: none; display: block; }
    .shorts-page-info { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); text-align: center; margin-top: 8px; }

    .no-video { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gray); padding: 3rem 0; text-align: center; border: 1px dashed var(--border); }

    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--gray); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: inline-block; width: 16px; height: 2px; background: var(--red); }
    .spotify-embed iframe { width: 100%; border: none; border-radius: 12px; display: block; }
    .apple-embed iframe { width: 100%; border: none; border-radius: 12px; display: block; }

    .song-info { background: var(--white); border: 1px solid var(--border); }
    .song-info-row { display: flex; gap: 16px; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); }
    .song-info-row:last-child { border-bottom: none; }
    .song-info-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray); width: 110px; flex-shrink: 0; padding-top: 2px; }
    .song-info-value { font-size: 13px; color: var(--black); line-height: 1.7; }
    .song-info-value.empty { color: var(--gray); }
    .song-info-value a { text-decoration: underline; text-underline-offset: 2px; transition: color 0.12s; }
    .song-info-value a:hover { color: var(--red); }

    .live-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--black); border: 1px solid var(--black); }
    .live-stat { padding: 1.25rem 1rem; text-align: center; border-right: 1px solid rgba(255,255,255,0.15); }
    .live-stat:last-child { border-right: none; }
    .live-stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: #999; margin-bottom: 8px; }
    .live-stat-value { font-size: 13px; font-weight: 700; color: var(--white); line-height: 1.5; }
    .live-stat-value a { color: var(--white); }
    .live-stat-value a:hover { color: var(--red); }
    .live-stat-value.empty { color: #666; font-weight: 400; }
    .live-stat.count .live-stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 900; color: var(--red); line-height: 1; }

    .chart-card { background: var(--white); border: 1px solid var(--border); padding: 1.25rem; }

    .hbar-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .hbar-label { width: 56px; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; }
    .hbar-track-wrap { flex: 1; min-width: 0; }
    .hbar-fill { height: 14px; max-height: 14px; border-radius: 0 4px 4px 0; }
    .hbar-value { width: 42px; flex-shrink: 0; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gray); }
    .live-stat.count .live-stat-unit { font-size: 11px; font-weight: 700; color: #999; margin-left: 2px; }

    .live-history-list { list-style: none; background: var(--white); border: 1px solid var(--border); }
    .live-history-item { border-bottom: 1px solid #f0f0f0; }
    .live-history-item:last-child { border-bottom: none; }
    .live-history-row { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 12px; padding: 0.75rem 1.25rem; font-size: 12px; transition: background 0.15s, color 0.15s; }
    a.live-history-row:hover { background: var(--bg); color: var(--red); }
    .lh-date { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); }
    .lh-tour { font-weight: 500; color: var(--black); }
    .lh-venue { font-size: 11px; color: var(--gray); white-space: nowrap; }
    .show-more-btn { display: block; width: 100%; margin-top: 10px; padding: 0.7rem; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; background: var(--white); color: var(--black); border: 1px solid var(--black); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .show-more-btn:hover { background: var(--black); color: var(--white); }

    .action-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
    .action-btn { flex: 1 1 0; min-width: 200px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid var(--black); padding: 1.5rem 1.5rem; background: var(--black); color: var(--white); transition: background 0.15s; }
    .action-btn:hover { background: var(--red); border-color: var(--red); }
    .action-btn.outline { background: var(--white); color: var(--black); }
    .action-btn.outline:hover { background: var(--black); color: var(--white); }

    .footer { padding: 2rem; border-top: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; background: var(--white); margin-top: 2rem; }
    .footer-logo { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; }
    .footer-logo .red { color: var(--red); }
    .footer-copy { font-size: 10px; color: var(--gray); letter-spacing: 0.05em; text-align: right; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .page-header-title { font-size: 34px; }
      .song-info-row { flex-direction: column; gap: 4px; }
      .live-history-row { grid-template-columns: 1fr; gap: 2px; }
      .lh-venue { white-space: normal; }
      .live-stat { padding: 1rem 0.5rem; }
      .live-stat.count .live-stat-value { font-size: 26px; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-logo">Fan<span class="red">GNU</span></a>
    <div class="nav-links">
      <a href="members/members.html">メンバー</a>
      <a href="discography.html">ディスコグラフィー</a>
      <a href="live.html">ライブ</a>
    </div>
  </nav>

  <button type="button" class="back-link" id="backLink">← 戻る</button>

  <div class="page-header">
    <span class="disc-type-badge" id="typeBadge"></span>
    <div class="page-header-title-row">
      <h1 class="page-header-title" id="songTitle">読み込み中…</h1>
      <a href="#" id="lyricsLink" class="lyrics-btn" target="_blank" rel="noopener" style="display:none;">歌詞を見る ↗</a>
    </div>
  </div>

  <div class="content">
    <div id="liveStatsArea"></div>

    <div id="mediaArea"></div>

    <div id="shortsArea"></div>

    <div id="appleMusicArea"></div>

    <div id="tweetArea"></div>

    <div id="spotifyArea"></div>

    <dl class="song-info">
      <div class="song-info-row">
        <dt class="song-info-label">収録アルバム</dt>
        <dd class="song-info-value" id="infoAlbum">-</dd>
      </div>
      <div class="song-info-row">
        <dt class="song-info-label">リリース日</dt>
        <dd class="song-info-value" id="infoYear">-</dd>
      </div>
      <div class="song-info-row">
        <dt class="song-info-label">タイアップ情報</dt>
        <dd class="song-info-value" id="infoNote">-</dd>
      </div>
      <div class="song-info-row">
        <dt class="song-info-label">その他</dt>
        <dd class="song-info-value" id="infoExtra">-</dd>
      </div>
    </dl>

    <div id="liveYearsArea"></div>
    <div id="liveHistoryArea"></div>

    <div class="action-buttons">
      <a href="#" id="discographyLink" class="action-btn outline">← ディスコグラフィーに戻る</a>
      <a href="#" id="liveListLink" class="action-btn">ライブ一覧を見る →</a>
    </div>
  </div>

  <footer class="footer">
    <a href="../index.html" class="footer-logo">Fan<span class="red">GNU</span></a>
    <div class="footer-copy">
      非公式ファンサイト。King Gnuおよび関係各社とは一切関係ありません。<br>
      © FanGNU Unofficial
    </div>
  </footer>

  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setInfo(id, value) {
    const el = document.getElementById(id);
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function setExtra(id, value) {
    const el = document.getElementById(id);
    if (!value) {
      el.textContent = '-';
      el.classList.add('empty');
      return;
    }
    const parts = value.split(/(\[[^\]]+\]\([^)]+\))/g);
    el.innerHTML = parts.map(part => {
      const m = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      return m ? `<a href="${escH(m[2])}" target="_blank" rel="noopener">${escH(m[1])}</a>` : escH(part).replace(/\n/g, '<br>');
    }).join('');
    el.classList.remove('empty');
  }

  function setAlbumInfo(id, song) {
    const el = document.getElementById(id);
    if (song.album && song.album.title) {
      const target = isSrvvinci ? 'srvvinci.html' : 'discography.html';
      const numText = song.album.num ? `（${String(song.album.num).padStart(2,'0')}）` : '';
      el.innerHTML = `<a href="${target}?album=${encodeURIComponent(song.album.title)}">${escH(song.album.title)}${numText}</a>`;
      el.classList.remove('empty');
    } else if (song.albumText) {
      el.textContent = song.albumText;
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function setLyrics(url) {
    const link = document.getElementById('lyricsLink');
    if (url) {
      link.href = url;
      link.style.display = '';
    } else {
      link.removeAttribute('href');
      link.style.display = 'none';
    }
  }

  function setNote(id, value) {
    const el = document.getElementById(id);
    if (value) {
      el.innerHTML = value.split(',').map(s => escH(s.trim()).replace(/\n/g, '<br>')).join('<br>');
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function appleMusicId(url) {
    if (!url) return '';
    const m = url.match(/(\d+)(?:\?.*)?$/);
    return m ? m[1] : '';
  }

  function renderAppleMusic(appleMusic) {
    const area = document.getElementById('appleMusicArea');
    if (!appleMusic) {
      area.innerHTML = '';
      return;
    }
    const embedUrl = appleMusic.replace('https://music.apple.com/', 'https://embed.music.apple.com/');
    area.innerHTML = `
      <div class="section-label">APPLE MUSIC</div>
      <div class="apple-embed">
        <iframe src="${escH(embedUrl)}" height="175" loading="lazy"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
          allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"></iframe>
      </div>`;
  }

  function externalVideoLabel(url) {
    if (/(?:^|\.)(?:twitter|x)\.com/.test(url)) return '投稿を見る（X） ↗';
    if (/(?:^|\.)(?:youtube\.com|youtu\.be)/.test(url)) return '動画を見る（YouTube） ↗';
    return '動画を見る ↗';
  }

  function renderExternalVideo(url) {
    const area = document.getElementById('tweetArea');
    if (!url) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = `
      <div class="section-label">映像</div>
      <a href="${escH(url)}" target="_blank" rel="noopener" class="lyrics-btn">${externalVideoLabel(url)}</a>`;
  }

  function renderMedia(yt, title, appleMusic, externalVideo, spotify) {
    const mediaArea = document.getElementById('mediaArea');
    if (!yt) {
      mediaArea.innerHTML = (appleMusic || externalVideo || spotify) ? '' : `<div class="no-video">この曲の動画は見つかりませんでした。</div>`;
      return;
    }
    mediaArea.innerHTML = `
      <div class="mv-thumb-wrap" data-yt="${escH(yt)}">
        <img src="https://img.youtube.com/vi/${escH(yt)}/maxresdefault.jpg" alt="${escH(title)} MV" loading="lazy">
        <div class="mv-thumb-play"><div class="mv-thumb-play-btn"></div></div>
      </div>
      <div class="mv-embed"></div>`;

    const thumbImg = mediaArea.querySelector('.mv-thumb-wrap img');
    thumbImg.addEventListener('load', () => {
      if (thumbImg.naturalWidth === 120) thumbImg.src = `https://img.youtube.com/vi/${escH(yt)}/hqdefault.jpg`;
    });
    thumbImg.addEventListener('error', () => {
      thumbImg.src = `https://img.youtube.com/vi/${escH(yt)}/hqdefault.jpg`;
    });

    mediaArea.querySelector('.mv-thumb-wrap').addEventListener('click', () => {
      const thumb = mediaArea.querySelector('.mv-thumb-wrap');
      const embed = mediaArea.querySelector('.mv-embed');
      thumb.style.display = 'none';
      embed.classList.add('open');
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?rel=0&autoplay=1&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
    });
  }

  let shortsData = [];
  let shortsIndex = 0;

  function wireShortsThumb(thumb) {
    thumb.addEventListener('click', () => {
      const yt = thumb.dataset.yt;
      const embed = thumb.nextElementSibling;
      thumb.style.display = 'none';
      embed.classList.add('open');
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?rel=0&autoplay=1&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
    });
  }

  function renderShortsPage() {
    const grid = document.getElementById('shortsGrid');
    const pageInfo = document.getElementById('shortsPageInfo');
    const len = shortsData.length;
    const count = Math.min(2, len);
    const items = [];
    for (let i = 0; i < count; i++) items.push(shortsData[(shortsIndex + i) % len]);

    grid.innerHTML = items.map(yt => `
      <div class="shorts-thumb" data-yt="${escH(yt)}">
        <img src="https://img.youtube.com/vi/${escH(yt)}/hqdefault.jpg" alt="behind the scenes" loading="lazy">
        <div class="mv-thumb-play"><div class="mv-thumb-play-btn"></div></div>
      </div>
      <div class="shorts-embed"></div>`).join('');
    grid.querySelectorAll('.shorts-thumb').forEach(wireShortsThumb);

    if (pageInfo) pageInfo.textContent = `${shortsIndex + 1} / ${len}`;
  }

  function renderShorts(shorts) {
    const area = document.getElementById('shortsArea');
    if (!shorts || !shorts.length) {
      area.innerHTML = '';
      return;
    }
    shortsData = shorts;
    shortsIndex = 0;
    const hasMultiple = shorts.length > 1;

    area.innerHTML = `
      <div class="section-label">BEHIND THE SCENES</div>
      <div class="shorts-wrap">
        ${hasMultiple ? `<button type="button" class="shorts-nav-btn" id="shortsPrev" aria-label="前へ">←</button>` : ''}
        <div class="shorts-grid" id="shortsGrid"></div>
        ${hasMultiple ? `<button type="button" class="shorts-nav-btn" id="shortsNext" aria-label="次へ">→</button>` : ''}
      </div>
      ${hasMultiple ? `<div class="shorts-page-info" id="shortsPageInfo"></div>` : ''}`;

    if (hasMultiple) {
      document.getElementById('shortsPrev').addEventListener('click', () => {
        shortsIndex = (shortsIndex - 1 + shortsData.length) % shortsData.length;
        renderShortsPage();
      });
      document.getElementById('shortsNext').addEventListener('click', () => {
        shortsIndex = (shortsIndex + 1) % shortsData.length;
        renderShortsPage();
      });
    }

    renderShortsPage();
  }

  function parseSpotify(value) {
    if (!value) return null;
    if (!/^https?:\/\//.test(value)) return { type: 'track', id: value };
    const m = value.match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(track|album|episode|show)\/([a-zA-Z0-9]+)/);
    return m ? { type: m[1], id: m[2] } : null;
  }

  function renderSpotify(spotifyValue) {
    const area = document.getElementById('spotifyArea');
    const parsed = parseSpotify(spotifyValue);
    if (!parsed) {
      area.innerHTML = '';
      return;
    }
    const height = parsed.type === 'track' || parsed.type === 'episode' ? 152 : 352;
    area.innerHTML = `
      <div class="section-label">SPOTIFY</div>
      <div class="spotify-embed">
        <iframe src="https://open.spotify.com/embed/${parsed.type}/${parsed.id}?utm_source=generator"
          height="${height}" loading="lazy"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>`;
  }

  function normalizeTitle(title) {
    return title
      .replace(/\s*★.*$/, '')
      .replace(/[（(][^）)]*[）)]\s*$/, '')
      .trim();
  }

  async function collectLiveHits(file, title, normTarget, source) {
    try {
      const res = await fetch(file);
      const data = await res.json();
      const results = [];
      (data.tours || []).forEach(tour => {
        (tour.shows || []).forEach(show => {
          const hit = (show.setlist || []).some(s => s === title || normalizeTitle(s) === normTarget);
          if (hit) results.push({ date: show.date, tourName: tour.name, venue: show.venue, source });
        });
      });
      return results;
    } catch (err) {
      console.error(err);
      return [];
    }
  }

  async function findLiveHistory(title) {
    if (!title) return [];
    const normTarget = normalizeTitle(title);
    const [kinggnuHits, srvvinciHits] = await Promise.all([
      collectLiveHits('data/kinggnu-live.json', title, normTarget, 'kinggnu'),
      collectLiveHits('data/srvvinci-live.json', title, normTarget, 'srvvinci'),
    ]);
    const results = [...kinggnuHits, ...srvvinciHits];
    results.sort((a, b) => b.date.localeCompare(a.date));
    return results;
  }

  function liveLinkHtml(entry) {
    if (!entry) return `<span class="live-stat-value empty">-</span>`;
    const srcParam = entry.source === 'srvvinci' ? '&src=srvvinci' : '';
    return `<a href="live-show.html?date=${encodeURIComponent(entry.date)}${srcParam}">${escH(entry.date)}<br>${escH(entry.tourName)}</a>`;
  }

  function renderLiveStats(history) {
    const area = document.getElementById('liveStatsArea');
    const first = history.length ? history[history.length - 1] : null;
    const last = history.length ? history[0] : null;
    area.innerHTML = `
      <div class="live-stats">
        <div class="live-stat">
          <div class="live-stat-label">初披露</div>
          <div class="live-stat-value">${liveLinkHtml(first)}</div>
        </div>
        <div class="live-stat count">
          <div class="live-stat-label">通算披露回数</div>
          <div class="live-stat-value">${history.length}<span class="live-stat-unit">回</span></div>
        </div>
        <div class="live-stat">
          <div class="live-stat-label">最終披露</div>
          <div class="live-stat-value">${liveLinkHtml(last)}</div>
        </div>
      </div>`;
  }

  function renderLiveYears(history) {
    const area = document.getElementById('liveYearsArea');
    if (!history.length) {
      area.innerHTML = '';
      return;
    }
    const counts = new Map();
    history.forEach(h => {
      const y = (h.date || '').slice(0, 4);
      if (!y) return;
      counts.set(y, (counts.get(y) || 0) + 1);
    });
    const years = [...counts.keys()].sort();
    const max = Math.max(...counts.values());
    area.innerHTML = `
      <div class="section-label">披露年別回数</div>
      <div class="chart-card">
        ${years.map(y => {
          const c = counts.get(y);
          const pct = (c / max) * 100;
          return `
            <div class="hbar-row">
              <div class="hbar-label">${escH(y)}年</div>
              <div class="hbar-track-wrap"><div class="hbar-fill" style="width:${pct}%;background:var(--red)"></div></div>
              <div class="hbar-value">${c}回</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  const LIVE_HISTORY_INITIAL_COUNT = 10;

  function liveHistoryItemHtml(h) {
    const srcParam = h.source === 'srvvinci' ? '&src=srvvinci' : '';
    return `
      <li class="live-history-item">
        <a class="live-history-row" href="live-show.html?date=${encodeURIComponent(h.date)}${srcParam}">
          <span class="lh-date">${escH(h.date)}</span>
          <span class="lh-tour">${escH(h.tourName)}</span>
          <span class="lh-venue">${escH(h.venue || '')}</span>
        </a>
      </li>`;
  }

  function renderLiveHistory(history) {
    const area = document.getElementById('liveHistoryArea');
    if (!history.length) {
      area.innerHTML = '';
      return;
    }
    const initial = history.slice(0, LIVE_HISTORY_INITIAL_COUNT);
    const rest = history.slice(LIVE_HISTORY_INITIAL_COUNT);
    area.innerHTML = `
      <div class="section-label">LIVE HISTORY（全${history.length}回）</div>
      <ol class="live-history-list" id="liveHistoryList">${initial.map(liveHistoryItemHtml).join('')}</ol>
      ${rest.length ? `<button type="button" class="show-more-btn" id="liveHistoryShowMore">もっと表示（他${rest.length}件）</button>` : ''}`;
    if (rest.length) {
      document.getElementById('liveHistoryShowMore').addEventListener('click', function onClick() {
        document.getElementById('liveHistoryList').insertAdjacentHTML('beforeend', rest.map(liveHistoryItemHtml).join(''));
        this.remove();
      });
    }
  }

  function setMetaContent(selector, content) {
    const el = document.querySelector(selector);
    if (el) el.setAttribute('content', content);
  }

  function renderSong(song) {
    const pageTitle = (song.title ? song.title + ' — ' : '') + '楽曲詳細 — FanGNU';
    document.title = pageTitle;
    if (song.title) {
      const desc = `King Gnu${isSrvvinci ? '（前身バンド時代）' : ''}「${song.title}」の楽曲詳細ページ。${song.note ? song.note.split(',')[0] + '。' : ''}MV・タイアップ情報・ライブ披露履歴などをまとめて掲載。`;
      setMetaContent('meta[name="description"]', desc);
      setMetaContent('meta[property="og:title"]', pageTitle);
      setMetaContent('meta[property="og:description"]', desc);
    }

    const typeBadge = document.getElementById('typeBadge');
    if (song.type) {
      typeBadge.textContent = song.type;
      typeBadge.classList.add(song.type);
    } else {
      typeBadge.style.display = 'none';
    }

    document.getElementById('songTitle').textContent = song.title || '（タイトル不明）';

    setAlbumInfo('infoAlbum', song);
    setInfo('infoYear', song.year);
    setNote('infoNote', song.note);
    setExtra('infoExtra', song.extra);
    setLyrics(song.lyrics);

    renderMedia(song.yt, song.title, song.appleMusic, song.externalVideo, song.spotify);
    renderShorts(song.shorts);
    renderAppleMusic(song.appleMusic);
    renderExternalVideo(song.externalVideo);
    renderSpotify(song.spotify);
  }

  function renderNotFound() {
    document.getElementById('songTitle').textContent = '曲が見つかりませんでした';
    document.getElementById('typeBadge').style.display = 'none';
    setLyrics('');
    renderMedia('', '');
    renderShorts([]);
    renderAppleMusic('');
    renderExternalVideo('');
    renderSpotify('');
  }

  async function findInDiscography(yt, ext, sp) {
    const res = await fetch('data/kinggnu-discography.json');
    const data = await res.json();
    const matches = (i) => (yt && i.yt === yt) || (ext && i.externalVideo === ext) || (sp && i.spotify === sp);
    const item = data.items.find(matches);
    const couplingParent = data.items.find(i => i.coupling && matches(i.coupling));

    let album = null;
    for (const a of data.albums) {
      const track = (a.tracks || []).find(t => (yt && t.yt === yt) || (ext && t.externalVideo === ext) || (sp && t.spotify === sp));
      if (track) { album = { title: a.title, num: track.num, year: a.year, track }; break; }
    }

    if (item) {
      return { type: item.type, title: item.title, year: item.year, note: item.note, extra: item.extra, yt: item.yt, spotify: item.spotify, externalVideo: item.externalVideo || '', lyrics: item.lyrics || '', shorts: item.shorts || [], album, albumText: item.albumText || '' };
    }

    if (couplingParent) {
      const c = couplingParent.coupling;
      return { type: couplingParent.type, title: c.title, year: couplingParent.year, note: c.note, extra: c.extra || '', yt: c.yt, spotify: c.spotify, externalVideo: c.externalVideo || '', lyrics: c.lyrics || '', album };
    }

    if (album) {
      const t = album.track;
      return { type: 'ALBUM', title: t.title, year: album.year, note: t.note, extra: t.extra || '', yt: t.yt, spotify: t.spotify, externalVideo: t.externalVideo || '', lyrics: t.lyrics || '', album: { title: album.title, num: album.num } };
    }

    return null;
  }

  async function findInSrvvinci(yt, am, ext) {
    const res = await fetch('data/srvvinci-discography.json');
    const data = await res.json();
    for (const group of data.groups) {
      const collections = [
        ...(group.demos || []).filter(d => d.tracks).map(d => ({ ...d, type: d.type || 'DEMO' })),
        ...(group.singles || []).filter(d => d.tracks).map(d => ({ ...d, type: d.type || 'SINGLE' })),
        ...(group.albums || []).map(a => ({ ...a, type: a.type || 'ALBUM' })),
      ];

      // トラック単位の一致を最優先（同じ動画IDが単体シングルとしても登録されている場合、収録アルバム情報を優先して表示するため）
      for (const coll of collections) {
        const track = (coll.tracks || []).find(t => (yt && t.yt === yt) || (am && appleMusicId(t.appleMusic) === am) || (ext && t.externalVideo === ext));
        if (track) {
          return { type: coll.type, title: track.title, year: coll.year || '', note: track.note || '', extra: '', yt: track.yt || '', spotify: track.spotify || '', appleMusic: track.appleMusic || '', externalVideo: track.externalVideo || '', lyrics: track.lyrics || '', album: { title: coll.title, num: track.num } };
        }
      }

      const flatPools = [
        ...(group.demos || []).filter(d => !d.tracks).map(d => ({ ...d, type: d.type || 'DEMO' })),
        ...(group.singles || []).filter(d => !d.tracks).map(d => ({ ...d, type: d.type || 'SINGLE' })),
      ];
      const item = flatPools.find(i => (yt && i.yt === yt) || (ext && i.externalVideo === ext));
      if (item) return { type: item.type, title: item.title, year: item.year || '', note: item.note || '', extra: item.extra, yt: item.yt, spotify: item.spotify || '', appleMusic: '', externalVideo: item.externalVideo || '', lyrics: item.lyrics || '', album: null };

      for (const coll of collections) {
        if (yt && coll.yt === yt) {
          return { type: coll.type, title: coll.title, year: coll.year || '', note: coll.note || '', extra: '', yt: coll.yt, spotify: '', appleMusic: '', lyrics: coll.lyrics || '', album: null };
        }
      }
    }
    return null;
  }

  const params = new URLSearchParams(location.search);
  const yt  = params.get('yt') || '';
  const am  = params.get('am') || '';
  const ext = params.get('ext') || '';
  const sp  = params.get('sp') || '';
  const src = params.get('src') === 'srvvinci' ? 'srvvinci' : 'discography';

  const isSrvvinci = src === 'srvvinci';
  document.getElementById('discographyLink').href = isSrvvinci ? 'srvvinci.html' : 'discography.html';
  document.getElementById('liveListLink').href = isSrvvinci ? 'srvvinci-live.html' : 'live.html';

  const lookup = isSrvvinci ? findInSrvvinci(yt, am, ext) : findInDiscography(yt, ext, sp);
  lookup
    .then(song => {
      if (!song) { renderNotFound(); return null; }
      renderSong(song);
      return findLiveHistory(song.title);
    })
    .then(history => {
      const list = history || [];
      renderLiveStats(list);
      renderLiveYears(list);
      renderLiveHistory(list);
    })
    .catch(err => {
      console.error(err);
      renderNotFound();
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = 'discography.html';
    }
  });
  </script>
