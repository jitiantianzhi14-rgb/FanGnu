<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>アルバム概要 — FunGNU!!!</title>
  <meta name="description" content="King Gnuのアルバム概要ページ。発売日・収録曲などをまとめて掲載。">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body>
  <p>移動しています… <a href="../discography/" id="fallbackLink">ディスコグラフィーへ</a></p>
  <script>
    var params = new URLSearchParams(location.search);
    var album = params.get('album') || '';
    var isSrvvinci = params.get('src') === 'srvvinci';
    if (album) {
      location.replace('./' + encodeURIComponent(album) + (isSrvvinci ? '-srvvinci' : '') + '/');
    } else {
      location.replace(isSrvvinci ? '../srvvinci-discography/' : '../discography/');
    }
  </script>
</body>
</html>
