  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #e63329; --black: #111; --white: #fff; --gray: #888; --border: #ddd; --bg: #fbf2d9; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--black); line-height: 1.6; padding-bottom: 58px; }
    a { color: inherit; text-decoration: none; }

    .nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 52px; }
    .nav-logo { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
    .nav-logo .red { color: var(--red); }
    .nav-links { display: flex; gap: 1.75rem; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
    .nav-links a { color: var(--gray); transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--black); }
    .nav-links a.active { border-bottom: 1px solid var(--black); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--white); border-top: 2px solid var(--black); z-index: 200; }
    .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; color: var(--gray); transition: color 0.15s; }
    .bn-item:hover { color: var(--black); }
    .bn-item.active { color: var(--red); }
    .bn-icon { font-size: 18px; line-height: 1; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; margin: 1.25rem 2rem 0; padding: 0; background: none; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); cursor: pointer; }
    .back-link:hover { color: var(--black); }

    .page-header { padding: 0.75rem 2rem 2.5rem; border-bottom: 2px solid var(--black); background: var(--white); }
    .live-badge { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 8px; background: var(--black); color: var(--white); white-space: nowrap; display: inline-block; margin-bottom: 1rem; }
    .live-badge.sold { background: var(--red); }
    .page-header-tour { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--gray); }
    .page-header-title { font-family: 'Zen Antique', serif; font-size: 44px; line-height: 1.2; letter-spacing: -0.02em; margin-top: 0.5rem; }
    .page-header-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gray); margin-top: 0.75rem; }

    .content { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem; }

    .mv-thumb-wrap { position: relative; cursor: pointer; margin-bottom: 1.5rem; }
    .mv-thumb-wrap img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .mv-thumb-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); transition: background 0.15s; }
    .mv-thumb-wrap:hover .mv-thumb-play { background: rgba(0,0,0,0.45); }
    .mv-thumb-play-btn { width: 56px; height: 56px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .mv-thumb-play-btn::after { content: ''; border-style: solid; border-width: 11px 0 11px 22px; border-color: transparent transparent transparent #fff; margin-left: 5px; }
    .mv-embed { display: none; margin-bottom: 1.5rem; }
    .mv-embed.open { display: block; }
    .mv-embed iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

    .video-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--gray); margin-bottom: 6px; }
    .video-more-btn { display: block; width: 100%; margin-bottom: 1.5rem; padding: 0.7rem; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; background: var(--white); color: var(--black); border: 1px solid var(--black); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .video-more-btn:hover { background: var(--black); color: var(--white); }

    .detail-address { font-size: 13px; color: #555; }
    .detail-note { font-size: 12px; color: var(--red); margin-top: 8px; }
    .map-area { margin-top: 1.25rem; border: 1px solid var(--border); }
    .map-area iframe { width: 100%; height: 260px; border: none; display: block; }

    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--gray); margin: 2rem 0 1rem; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: inline-block; width: 16px; height: 2px; background: var(--red); }
    .spotify-embed iframe { width: 100%; border: none; border-radius: 12px; display: block; }
    .setlist-list { list-style: none; background: var(--white); border: 1px solid var(--border); }
    .setlist-item { border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .setlist-item:last-child { border-bottom: none; }
    .setlist-row { display: flex; align-items: center; gap: 12px; padding: 0.7rem 1.25rem; }
    a.setlist-row { cursor: pointer; transition: background 0.15s, color 0.15s; }
    a.setlist-row:hover { background: var(--bg); color: var(--red); }
    .setlist-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); width: 22px; flex-shrink: 0; }
    .no-setlist { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gray); padding: 2rem 0; text-align: center; border: 1px dashed var(--border); margin-top: 2rem; }

    .action-buttons { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    .header-btn { flex: 1 1 0; min-width: 200px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid var(--black); padding: 1.5rem 1.5rem; background: var(--black); color: var(--white); transition: background 0.15s; }
    .header-btn:hover { background: var(--red); border-color: var(--red); }
    .header-btn.outline { background: var(--white); color: var(--black); }
    .header-btn.outline:hover { background: var(--black); color: var(--white); }

    @media (max-width: 600px) {
      .header-btn { flex: 1 1 100%; }
    }

    .footer { padding: 2rem; border-top: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; background: var(--white); margin-top: 2rem; }
    .footer-logo { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; }
    .footer-logo .red { color: var(--red); }
    .footer-copy { font-size: 10px; color: var(--gray); letter-spacing: 0.05em; text-align: right; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .page-header-title { font-size: 32px; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <button type="button" class="back-link" id="backLink">← 戻る</button>

  <div class="page-header">
    <span class="live-badge" id="statusBadge" style="display:none;"></span>
    <div class="page-header-tour" id="tourName"></div>
    <h1 class="page-header-title" id="venueName">読み込み中…</h1>
    <div class="page-header-date" id="showDate"></div>
  </div>

  <div class="content">
    <div id="mediaArea"></div>

    <div class="detail-address" id="address"></div>

    <div class="action-buttons">

    </div>
  </div>

  <footer class="footer">
    <a href="../index.html" class="footer-logo">Fan<span class="red">GNU</span></a>
    <div class="footer-copy">
      非公式ファンサイト。King Gnuおよび関係各社とは一切関係ありません。<br>
      © FanGNU Unofficial
    </div>
  </footer>

  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function normalizeTitle(title) {
    return title
      .replace(/\s*★.*$/, '')
      .replace(/[（(][^）)]*[）)]\s*$/, '')
      .trim();
  }

  function resolveSongInfo(title, songIndex) {
    if (songIndex.has(title)) return songIndex.get(title);
    const norm = normalizeTitle(title);
    if (norm !== title && songIndex.has(norm)) return songIndex.get(norm);
    return null;
  }

  function appleMusicId(url) {
    if (!url) return '';
    const m = url.match(/(\d+)(?:\?.*)?$/);
    return m ? m[1] : '';
  }

  function tweetId(url) {
    if (!url) return '';
    const m = url.match(/status\/(\d+)/);
    return m ? m[1] : '';
  }

  function songHref(info) {
    const params = new URLSearchParams();
    if (info.src === 'srvvinci') params.set('src', 'srvvinci');
    if (info.yt) params.set('yt', info.yt);
    else if (info.appleMusic) params.set('am', appleMusicId(info.appleMusic));
    else if (info.tweet) params.set('tweet', tweetId(info.tweet));
    else return null;
    return `song.html?${params.toString()}`;
  }

  function buildKgEntries(data) {
    const entries = [];
    (data.items || []).forEach(item => {
      entries.push([item.title, { yt: item.yt || '', src: 'discography' }]);
      if (item.coupling && item.coupling.title) entries.push([item.coupling.title, { yt: item.coupling.yt || '', src: 'discography' }]);
    });
    (data.albums || []).forEach(album => {
      (album.tracks || []).forEach(t => entries.push([t.title, { yt: t.yt || '', src: 'discography' }]));
    });
    return entries;
  }

  function buildSvEntries(data) {
    const entries = [];
    (data.groups || []).forEach(group => {
      const flatItems = [
        ...(group.demos || []).filter(d => !d.tracks),
        ...(group.singles || []).filter(d => !d.tracks),
      ];
      flatItems.forEach(d => entries.push([d.title, { yt: d.yt || '', appleMusic: d.appleMusic || '', tweet: d.url || '', src: 'srvvinci' }]));

      const collections = [
        ...(group.demos || []).filter(d => d.tracks),
        ...(group.singles || []).filter(d => d.tracks),
        ...(group.albums || []),
      ];
      collections.forEach(coll => {
        if (coll.yt) entries.push([coll.title, { yt: coll.yt, src: 'srvvinci' }]);
        (coll.tracks || []).forEach(t => entries.push([t.title, { yt: t.yt || '', appleMusic: t.appleMusic || '', src: 'srvvinci' }]));
      });
    });
    return entries;
  }

  // 曲名インデックスは常に King Gnu / Srv.Vinci 両方のディスコグラフィーを合成する
  // （King Gnu名義のライブでもSrv.Vinci時代の楽曲が演奏されているケースがあるため）。
  // isSrvvinciはどちらのカタログを優先して名前を解決するかの判定にのみ使う。
  async function loadSongIndex(isSrvvinci) {
    const index = new Map();
    const addSong = (title, entry) => { if (!index.has(title)) index.set(title, entry); };
    try {
      const [kgRes, svRes] = await Promise.all([
        fetch('data/kinggnu-discography.json'),
        fetch('data/srvvinci-discography.json'),
      ]);
      const kgEntries = buildKgEntries(await kgRes.json());
      const svEntries = buildSvEntries(await svRes.json());
      const ordered = isSrvvinci ? [...svEntries, ...kgEntries] : [...kgEntries, ...svEntries];
      ordered.forEach(([title, entry]) => addSong(title, entry));
    } catch (err) {
      console.error(err);
    }
    return index;
  }

  const VIDEO_INITIAL_COUNT = 4;

  function buildVideoItem(video, title) {
    return `
      <div class="video-item">
        ${video.songs ? `<div class="video-label">${escH(video.songs)}</div>` : ''}
        <div class="mv-thumb-wrap" data-yt="${escH(video.yt)}">
          <img src="https://img.youtube.com/vi/${escH(video.yt)}/maxresdefault.jpg" alt="${escH(title)} ライブ映像" loading="lazy">
          <div class="mv-thumb-play"><div class="mv-thumb-play-btn"></div></div>
        </div>
        <div class="mv-embed"></div>
      </div>`;
  }

  function wireVideoItem(item) {
    const yt = item.querySelector('.mv-thumb-wrap').dataset.yt;
    const thumbImg = item.querySelector('.mv-thumb-wrap img');
    thumbImg.addEventListener('load', () => {
      if (thumbImg.naturalWidth === 120) thumbImg.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
    });
    thumbImg.addEventListener('error', () => {
      thumbImg.src = `https://img.youtube.com/vi/${yt}/hqdefault.jpg`;
    });
    item.querySelector('.mv-thumb-wrap').addEventListener('click', () => {
      const thumb = item.querySelector('.mv-thumb-wrap');
      const embed = item.querySelector('.mv-embed');
      thumb.style.display = 'none';
      embed.classList.add('open');
      embed.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?rel=0&autoplay=1&playsinline=1" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
    });
  }

  function renderMedia(videos, title) {
    const mediaArea = document.getElementById('mediaArea');
    if (!videos || !videos.length) {
      mediaArea.innerHTML = '';
      return;
    }
    const initial = videos.slice(0, VIDEO_INITIAL_COUNT);
    const rest = videos.slice(VIDEO_INITIAL_COUNT);

    mediaArea.innerHTML = initial.map(v => buildVideoItem(v, title)).join('');
    mediaArea.querySelectorAll('.video-item').forEach(wireVideoItem);

    if (rest.length) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'video-more-btn';
      btn.textContent = `もっと表示（他${rest.length}件）`;
      btn.addEventListener('click', () => {
        btn.insertAdjacentHTML('beforebegin', rest.map(v => buildVideoItem(v, title)).join(''));
        Array.from(mediaArea.querySelectorAll('.video-item')).slice(initial.length).forEach(wireVideoItem);
        btn.remove();
      });
      mediaArea.appendChild(btn);
    }
  }

  function spotifyPlaylistId(url) {
    if (!url) return '';
    const m = url.match(/playlist\/([a-zA-Z0-9]+)/);
    return m ? m[1] : '';
  }

  function renderSpotifyPlaylist(url) {
    const area = document.getElementById('spotifyArea');
    const id = spotifyPlaylistId(url);
    if (!id) {
      area.innerHTML = '';
      return;
    }
    area.innerHTML = `
      <div class="section-label">SETLIST PLAYLIST</div>
      <div class="spotify-embed">
        <iframe src="https://open.spotify.com/embed/playlist/${id}?utm_source=generator"
          height="352" loading="lazy"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>`;
  }

  function renderSetlist(setlist, songIndex) {
    const area = document.getElementById('setlistArea');
    if (!setlist || !setlist.length) {
      area.innerHTML = `<div class="no-setlist">セットリスト情報はまだありません。</div>`;
      return;
    }
    area.innerHTML = `
      <div class="section-label">SETLIST</div>
      <ol class="setlist-list">${setlist.map((s, i) => {
        const inner = `<span class="setlist-num">${String(i + 1).padStart(2, '0')}</span>${escH(s)}`;
        const info = resolveSongInfo(s, songIndex);
        const href = info ? songHref(info) : null;
        return href
          ? `<li class="setlist-item"><a class="setlist-row" href="${href}">${inner}</a></li>`
          : `<li class="setlist-item"><span class="setlist-row">${inner}</span></li>`;
      }).join('')}</ol>`;
  }

  function setMetaContent(selector, content) {
    const el = document.querySelector(selector);
    if (el) el.setAttribute('content', content);
  }

  function renderShow(tour, show, songIndex) {
    const pageTitle = `${show.venue || show.location} — 公演詳細 — FanGNU`;
    document.title = pageTitle;
    const desc = `${show.date} ${tour.name}（${show.venue || show.location}）の公演詳細。セットリストなどをまとめて掲載。`;
    setMetaContent('meta[name="description"]', desc);
    setMetaContent('meta[property="og:title"]', pageTitle);
    setMetaContent('meta[property="og:description"]', desc);

    const badge = document.getElementById('statusBadge');
    if (show.status) {
      badge.textContent = show.status;
      badge.style.display = 'inline-block';
      if (show.status === 'SOLD OUT') badge.classList.add('sold');
    }

    document.getElementById('tourName').textContent = tour.name;
    document.getElementById('venueName').textContent = show.venue || '会場未定';
    document.getElementById('showDate').textContent = show.date;
    document.getElementById('address').textContent = show.location;

    renderMedia(show.videos, show.venue || tour.name);

    if (show.note) {
      const noteEl = document.getElementById('noteText');
      noteEl.textContent = `※${show.note}`;
      noteEl.style.display = 'block';
    }

    const mapQuery = show.location || show.venue;
    if (mapQuery) {
      const mapArea = document.getElementById('mapArea');
      mapArea.innerHTML = `<iframe src="https://maps.google.com/maps?q=${encodeURIComponent(mapQuery)}&output=embed" loading="lazy" allowfullscreen></iframe>`;
      mapArea.style.display = 'block';
    }

    renderSpotifyPlaylist(show.spotifyPlaylist);
    renderSetlist(show.setlist, songIndex);
  }

  function renderNotFound() {
    document.getElementById('venueName').textContent = '公演情報が見つかりませんでした';
    renderMedia([], '');
    renderSpotifyPlaylist('');
    renderSetlist([], new Map());
  }

  async function findShow(date, isSrvvinci) {
    const res = await fetch(isSrvvinci ? 'data/srvvinci-live.json' : 'data/kinggnu-live.json');
    const data = await res.json();
    for (const tour of data.tours) {
      const show = (tour.shows || []).find(s => s.date === date);
      if (show) return { tour, show };
    }
    return null;
  }

  const params = new URLSearchParams(location.search);
  const date = params.get('date') || '';
  const isSrvvinci = params.get('src') === 'srvvinci';
  const backHref = isSrvvinci ? 'srvvinci-live.html' : 'live.html';
  document.getElementById('archiveLink').href = backHref;

  Promise.all([findShow(date, isSrvvinci), loadSongIndex(isSrvvinci)])
    .then(([result, songIndex]) => {
      if (result) renderShow(result.tour, result.show, songIndex);
      else renderNotFound();
    })
    .catch(err => {
      console.error(err);
      renderNotFound();
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = backHref;
    }
  });
  </script>
