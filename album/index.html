  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #e63329; --black: #111; --white: #fff; --gray: #888; --border: #ddd; --bg: #fbf2d9; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--black); line-height: 1.6; padding-bottom: 58px; }
    a { color: inherit; text-decoration: none; }

    .nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 52px; }
    .nav-logo { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
    .nav-logo .red { color: var(--red); }
    .nav-links { display: flex; gap: 1.75rem; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
    .nav-links a { color: var(--gray); transition: color 0.15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--black); }
    .nav-links a.active { border-bottom: 1px solid var(--black); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--white); border-top: 2px solid var(--black); z-index: 200; }
    .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px 6px; font-size: 9px; font-weight: 700; letter-spacing: 0.02em; color: var(--gray); transition: color 0.15s; }
    .bn-item:hover { color: var(--black); }
    .bn-item.active { color: var(--red); }
    .bn-icon { font-size: 18px; line-height: 1; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; margin: 1.25rem 2rem 0; padding: 0; background: none; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--gray); cursor: pointer; }
    .back-link:hover { color: var(--black); }

    .page-header { padding: 0.75rem 2rem 2.5rem; border-bottom: 2px solid var(--black); background: var(--white); }
    .disc-type-badge { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--white); background: var(--red); padding: 2px 8px; display: inline-block; width: fit-content; margin-bottom: 1rem; }
    .page-header-title { font-family: 'Zen Antique', serif; font-size: 40px; line-height: 1.3; letter-spacing: -0.02em; }

    .content { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem; display: flex; flex-direction: column; gap: 2rem; }

    .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.15em; color: var(--gray); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .section-label::before { content: ''; display: inline-block; width: 16px; height: 2px; background: var(--red); }

    .album-info { background: var(--white); border: 1px solid var(--border); }
    .album-info-row { display: flex; gap: 16px; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); }
    .album-info-row:last-child { border-bottom: none; }
    .album-info-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--gray); width: 110px; flex-shrink: 0; padding-top: 2px; }
    .album-info-value { font-size: 13px; color: var(--black); line-height: 1.7; }
    .album-info-value.empty { color: var(--gray); }
    .album-info-value a { text-decoration: underline; text-underline-offset: 2px; transition: color 0.12s; }
    .album-info-value a:hover { color: var(--red); }

    .track-list { list-style: none; background: var(--white); border: 1px solid var(--border); }
    .track-item { border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .track-item:last-child { border-bottom: none; }
    .track-row { display: flex; align-items: center; gap: 12px; padding: 0.7rem 1.25rem; }
    a.track-row { cursor: pointer; transition: background 0.15s, color 0.15s; }
    a.track-row:hover { background: var(--bg); color: var(--red); }
    .track-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gray); width: 22px; flex-shrink: 0; }
    .track-title { flex: 1; min-width: 0; }
    .track-detail-btn { width: 24px; height: 24px; background: var(--red); border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
    .no-tracks { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gray); padding: 2rem 0; text-align: center; border: 1px dashed var(--border); }

    .action-buttons { display: flex; gap: 14px; flex-wrap: wrap; }
    .action-btn { flex: 1 1 0; min-width: 200px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; border: 1px solid var(--black); padding: 1.5rem 1.5rem; background: var(--black); color: var(--white); transition: background 0.15s; }
    .action-btn:hover { background: var(--red); border-color: var(--red); }
    .action-btn.outline { background: var(--white); color: var(--black); }
    .action-btn.outline:hover { background: var(--black); color: var(--white); }

    .footer { padding: 2rem; border-top: 2px solid var(--black); display: flex; align-items: center; justify-content: space-between; background: var(--white); margin-top: 2rem; }
    .footer-logo { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; }
    .footer-logo .red { color: var(--red); }
    .footer-copy { font-size: 10px; color: var(--gray); letter-spacing: 0.05em; text-align: right; }
    .footer-copy a { text-decoration: underline; text-underline-offset: 2px; }
    .footer-copy a:hover { color: var(--red); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .page-header-title { font-size: 28px; }
      .album-info-row { flex-direction: column; gap: 4px; }
      .footer { flex-direction: column; gap: 1rem; align-items: flex-start; }
    }
  </style>

<body>

  <nav class="nav">
    <a href="../" class="nav-logo">Fun<span class="red">GNU</span></a>
    <div class="nav-links">
      <a href="../members/">メンバー</a>
      <a href="../discography/" class="active">ディスコグラフィー</a>
      <a href="../live/">ライブ</a>
    </div>
  </nav>

  <button type="button" class="back-link" id="backLink">← 戻る</button>

  <div class="page-header">
    <span class="disc-type-badge">ALBUM</span>
    <h1 class="page-header-title" id="albumTitle">読み込み中…</h1>
  </div>

  <div class="content">
    <dl class="album-info">
      <div class="album-info-row">
        <dt class="album-info-label">発売日</dt>
        <dd class="album-info-value" id="infoYear">-</dd>
      </div>
      <div class="album-info-row">
        <dt class="album-info-label">その他</dt>
        <dd class="album-info-value" id="infoExtra">-</dd>
      </div>
    </dl>

    <div>
      <div class="section-label">収録曲</div>
      <div id="tracksArea"></div>
    </div>

      <a href="#" id="discographyLink" class="action-btn outline">← ディスコグラフィーに戻る</a>

      <a href="../privacy/">プライバシーポリシー</a> ／ <a href="../contact/">お問い合わせ</a> ／ <a href="#" onclick="window.open('https://x.com/intent/tweet?text='+encodeURIComponent(document.title)+'&url='+encodeURIComponent(location.href),'_blank','noopener');return false;">𝕏でシェア</a> ／ © FunGNU Unofficial
    </div>
  </footer>

  <script>
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function setInfo(id, value) {
    const el = document.getElementById(id);
    if (value) {
      el.textContent = value;
      el.classList.remove('empty');
    } else {
      el.textContent = '-';
      el.classList.add('empty');
    }
  }

  function setExtra(id, value) {
    const el = document.getElementById(id);
    if (!value) {
      el.textContent = '-';
      el.classList.add('empty');
      return;
    }
    const parts = value.split(/(\[[^\]]+\]\([^)]+\))/g);
    el.innerHTML = parts.map(part => {
      const m = part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      if (!m) return escH(part).replace(/\n/g, '<br>');
      const isExternal = /^https?:\/\//.test(m[2]);
      return isExternal
        ? `<a href="${escH(m[2])}" target="_blank" rel="noopener">${escH(m[1])}</a>`
        : `<a href="${escH(m[2])}">${escH(m[1])}</a>`;
    }).join('');
    el.classList.remove('empty');
  }

  function appleMusicId(url) {
    if (!url) return '';
    const m = url.match(/(\d+)(?:\?.*)?$/);
    return m ? m[1] : '';
  }

  function songHref(t, isSrvvinci) {
    const params = new URLSearchParams();
    if (isSrvvinci) params.set('src', 'srvvinci');
    if (t.yt) params.set('yt', t.yt);
    else if (t.appleMusic) params.set('am', appleMusicId(t.appleMusic));
    else if (t.externalVideo) params.set('ext', t.externalVideo);
    else if (t.spotify) params.set('sp', t.spotify);
    else return null;
    return `../song/?${params.toString()}`;
  }

  function renderTracks(tracks, isSrvvinci) {
    const area = document.getElementById('tracksArea');
    if (!tracks || !tracks.length) {
      area.innerHTML = `<div class="no-tracks">収録曲情報はまだありません。</div>`;
      return;
    }
    area.innerHTML = `
      <ol class="track-list">${tracks.map(t => {
        const href = songHref(t, isSrvvinci);
        const inner = `
          <span class="track-num">${String(t.num).padStart(2, '0')}</span>
          <span class="track-title">${escH(t.displayTitle || t.title)}</span>
          ${href ? `<span class="track-detail-btn" aria-hidden="true">→</span>` : ''}`;
        return href
          ? `<li class="track-item"><a class="track-row" href="${href}">${inner}</a></li>`
          : `<li class="track-item"><span class="track-row">${inner}</span></li>`;
      }).join('')}</ol>`;
  }

  function renderAlbum(album, isSrvvinci) {
    document.title = `${album.title} — アルバム概要 — FunGNU`;
    document.getElementById('albumTitle').textContent = album.title;
    setInfo('infoYear', album.year);
    setExtra('infoExtra', album.extra);
    renderTracks(album.tracks, isSrvvinci);
    const backHref = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
    document.getElementById('discographyLink').href = `${backHref}?album=${encodeURIComponent(album.title)}`;
  }

  function renderNotFound(isSrvvinci) {
    document.getElementById('albumTitle').textContent = 'アルバムが見つかりませんでした';
    setInfo('infoYear', '');
    setExtra('infoExtra', '');
    renderTracks([]);
    document.getElementById('discographyLink').href = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
  }

  const params = new URLSearchParams(location.search);
  const albumTitle = params.get('album') || '';
  const isSrvvinci = params.get('src') === 'srvvinci';

  const dataUrl = isSrvvinci ? '../data/srvvinci-discography.json' : '../data/kinggnu-discography.json';

  fetch(dataUrl)
    .then(res => res.json())
    .then(data => {
      let album;
      if (isSrvvinci) {
        for (const group of (data.groups || [])) {
          album = [...(group.demos || []), ...(group.albums || [])].find(a => a.title === albumTitle);
          if (album) break;
        }
      } else {
        album = (data.albums || []).find(a => a.title === albumTitle);
      }
      if (!album) { renderNotFound(isSrvvinci); return; }
      renderAlbum(album, isSrvvinci);
    })
    .catch(err => {
      console.error(err);
      renderNotFound(isSrvvinci);
    });

  document.getElementById('backLink').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) {
      history.back();
    } else {
      location.href = isSrvvinci ? '../srvvinci-discography/' : '../discography/';
    }
  });
  </script>

    <a href="../discography/" class="bn-item"><span class="bn-icon">💿</span>ディスコグラフィー</a>
    <a href="../members/" class="bn-item"><span class="bn-icon">👥</span>メンバー</a>
